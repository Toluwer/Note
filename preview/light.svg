ill="none" stroke="#2f2f32" stroke-width="1.5"/><circle cx="98" cy="181" r="2" fill="none" stroke="#2f2f32" stroke-width="1.5"/><path d="M98 171v3m0 14v3m-10-10h3m14 0h3m-17-7 2 2m10 10 2 2m0-14-2 2m-10 10-2 2" stroke="#2f2f32" stroke-width="1.3"/><text x="116" y="186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#1c1c1e" text-anchor="start">General</text><circle cx="98" cy="228" r="8" fill="none" stroke="#4e4e53" stroke-width="1.5"/><circle cx="94" cy="225" r="1" fill="#4e4e53"/><circle cx="99" cy="223" r="1" fill="#4e4e53"/><circle cx="102" cy="227" r="1" fill="#4e4e53"/><text x="116" y="232" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#4e4e53" text-anchor="start">Appearance</text><circle cx="98" cy="276" r="8" fill="none" stroke="#4e4e53" stroke-width="1.5"/><text x="98" y="280" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#4e4e53" text-anchor="middle">i</text><text x="116" y="280" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#4e4e53" text-anchor="start">Diagnostics</text><rect x="264" y="120" width="472" height="210" rx="10" fill="#f2f2f4" fill-opacity=".82" stroke="#b9b9be" stroke-opacity=".58"/><text x="278" y="142" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#1c1c1e" text-anchor="start">Actions</text><text x="278" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#76767c" text-anchor="start">Buttons, status, modal actions, and smooth section collapsing.</text><path d="m710 145 6-6 6 6" fill="none" stroke="#76767c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="274" y="172" width="452" height="48" rx="7" fill="#ffffff" fill-opacity=".80"/><text x="286" y="192" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#1c1c1e" text-anchor="start">Run Action</text><text x="286" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#76767c" text-anchor="start">Executes a protected callback.</text><rect x="592" y="179" width="124" height="34" rx="7" fill="#2f2f32"/><path d="m606 190 12 7-7 2-2 6z" fill="none" stroke="#ffffff" stroke-width="1.4"/><text x="666" y="201" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Run Action</text><rect x="274" y="228" width="452" height="48" rx="7" fill="#ffffff" fill-opacity=".80"/><text x="286" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#1c1c1e" text-anchor="start">Open Dialog</text><text x="286" y="264" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#76767c" text-anchor="start">Shows a modal confirmation with temporary scene blur.</text><rect x="592" y="235" width="124" height="34" rx="7" fill="#ffffff" stroke="#b9b9be" stroke-opacity=".7"/><text x="654" y="257" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#1c1c1e" text-anchor="middle">Open Dialog</text><rect x="274" y="284" width="452" height="48" rx="7" fill="#ffffff" fill-opacity=".80"/><text x="286" y="304" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#1c1c1e" text-anchor="start">Enabled</text><text x="286" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#76767c" text-anchor="start">Animated switch with central flag state.</text><rect x="676" y="298" width="40" height="20" rx="10" fill="#dddddf"/><circle cx="686" cy="308" r="8" fill="#76767c"/><rect x="274" y="340" width="452" height="74" rx="7" fill="#ffffff" fill-opacity=".80"/><text x="286" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#1c1c1e" text-anchor="start">Amount</text><text x="286" y="376" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#76767c" text-anchor="start">Mouse and touch dragging with increment rounding.</text><text x="708" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#4e4e53" text-anchor="end">50%</text><rect x="286" y="392" width="420" height="6" rx="3" fill="#dddddf"/><rect x="286" y="392" width="210" height="6" rx="3" fill="#2f2f32"/><circle cx="496" cy="395" r="8" fill="#ffffff" stroke="#2f2f32" stroke-width="2"/><rect x="264" y="430" width="472" height="118" rx="10" fill="#f2f2f4" fill-opacity=".82" stroke="#b9b9be" stroke-opacity=".58"/><text x="278" y="452" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#1c1c1e" text-anchor="start">Data Entry</text><text x="278" y="470" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#76767c" text-anchor="start">Inputs and searchable choices.</text><path d="m710 455 6-6 6 6" fill="none" stroke="#76767c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="274" y="482" width="452" height="50" rx="7" fill="#ffffff" fill-opacity=".80"/><text x="286" y="502" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#1c1c1e" text-anchor="start">Username</text><text x="286" y="518" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.8" font-weight="400" fill="#76767c" text-anchor="start">The error clears as soon as three characters are entered.</text><rect x="526" y="490" width="190" height="34" rx="7" fill="#f7f7f8" fill-opacity=".9" stroke="#b9b9be" stroke-opacity=".6"/><text x="538" y="511" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#76767c" text-anchor="start">Username</text><rect x="274" y="540" width="452" height="50" rx="7" fill="#ffffff" fill-opacity=".80"/><text x="286" y="560" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#