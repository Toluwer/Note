name: Apply frosted glass and theme fixes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-frosted-theme.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source, example, and documentation fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8")

          def replace(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Patch target not found in {path}:\n{old}")
              text = text.replace(old, new, count)
              write(path, text)

          write("src/Themes/Dark.lua", '''return {
              Name = "Dark",
              Background = Color3.fromRGB(20, 20, 21),
              SecondaryBackground = Color3.fromRGB(25, 25, 26),
              Surface = Color3.fromRGB(31, 31, 32),
              SurfaceElevated = Color3.fromRGB(37, 37, 38),
              Input = Color3.fromRGB(27, 27, 28),
              SurfaceHover = Color3.fromRGB(42, 42, 43),
              SurfaceSelected = Color3.fromRGB(48, 48, 50),
              Border = Color3.fromRGB(78, 78, 82),
              Text = Color3.fromRGB(244, 244, 245),
              TextSecondary = Color3.fromRGB(194, 194, 197),
              TextMuted = Color3.fromRGB(145, 145, 150),
              Accent = Color3.fromRGB(190, 190, 194),
              AccentForeground = Color3.fromRGB(20, 20, 21),
              Destructive = Color3.fromRGB(218, 72, 82),
              Warning = Color3.fromRGB(205, 148, 61),
              Success = Color3.fromRGB(63, 160, 107),
              Scrollbar = Color3.fromRGB(112, 112, 118),
              Shadow = Color3.fromRGB(0, 0, 0),
              WindowTransparency = 0.14,
              SecondaryTransparency = 0.22,
              SurfaceTransparency = 0.20,
              ElevatedTransparency = 0.14,
              InputTransparency = 0.24,
              HoverTransparency = 0.18,
              SelectedTransparency = 0.10,
              BorderTransparency = 0.34,
              DisabledTransparency = 0.58,
              GlassBlur = 14,
          }
          ''')

          write("src/Themes/Light.lua", '''return {
              Name = "Light",
              Background = Color3.fromRGB(248, 248, 249),
              SecondaryBackground = Color3.fromRGB(242, 242, 244),
              Surface = Color3.fromRGB(255, 255, 255),
              SurfaceElevated = Color3.fromRGB(252, 252, 253),
              Input = Color3.fromRGB(247, 247, 248),
              SurfaceHover = Color3.fromRGB(238, 238, 240),
              SurfaceSelected = Color3.fromRGB(229, 229, 232),
              Border = Color3.fromRGB(185, 185, 190),
              Text = Color3.fromRGB(28, 28, 30),
              TextSecondary = Color3.fromRGB(78, 78, 83),
              TextMuted = Color3.fromRGB(118, 118, 124),
              Accent = Color3.fromRGB(47, 47, 50),
              AccentForeground = Color3.fromRGB(255, 255, 255),
              Destructive = Color3.fromRGB(190, 48, 58),
              Warning = Color3.fromRGB(157, 101, 20),
              Success = Color3.fromRGB(34, 126, 76),
              Scrollbar = Color3.fromRGB(135, 135, 141),
              Shadow = Color3.fromRGB(28, 28, 30),
              WindowTransparency = 0.16,
              SecondaryTransparency = 0.20,
              SurfaceTransparency = 0.14,
              ElevatedTransparency = 0.10,
              InputTransparency = 0.18,
              HoverTransparency = 0.14,
              SelectedTransparency = 0.08,
              BorderTransparency = 0.28,
              DisabledTransparency = 0.62,
              GlassBlur = 12,
          }
          ''')

          write("src/Components/ThemeSwitcher.lua", '''local BaseComponent = require("src/Internal/BaseComponent")
          local Utilities = require("src/Core/Utilities")

          local ThemeSwitcher = {}
          ThemeSwitcher.__index = ThemeSwitcher
          setmetatable(ThemeSwitcher, { __index = BaseComponent })

          function ThemeSwitcher.new(section, config)
              config = config or {}
              local themes = config.Themes or { "Dark", "Light" }
              assert(type(themes) == "table" and #themes > 0, "[Note] ThemeSwitcher Themes must be a non-empty array")

              local hasDescription = tostring(config.Description or "") ~= ""
              local self = BaseComponent.new(section, "ThemeSwitcher", config, hasDescription and 64 or 54)
              setmetatable(self, ThemeSwitcher)
              self.Themes = table.clone(themes)
              self.ResetAccent = config.ResetAccent ~= false
              self.Value = self.Window.ThemeManager.Name or themes[1]
              self.Buttons = {}
              self:AddTextBlock(-220)

              for _, themeName in ipairs(self.Themes) do
                  assert(self.Library.Themes[themeName], string.format('[Note] Unknown theme "%s"', tostring(themeName)))
              end

              local group = Utilities.Create("Frame", {
                  Name = "ThemeButtons",
                  BackgroundTransparency = 1,
                  AnchorPoint = Vector2.new(1, 0.5),
                  Position = UDim2.new(1, -10, 0.5, 0),
                  Size = UDim2.fromOffset(198, 34),
                  Parent = self.Frame,
              })
              local layout = Utilities.List(group, Enum.FillDirection.Horizontal, 4)
              layout.VerticalAlignment = Enum.VerticalAlignment.Center

              local buttonWidth = math.max(54, math.floor((198 - math.max(0, #self.Themes - 1) * 4) / #self.Themes))
              for index, themeName in ipairs(self.Themes) do
                  local button = Utilities.Create("TextButton", {
                      Name = "Theme_" .. themeName,
                      AutoButtonColor = false,
                      BorderSizePixel = 0,
                      Size = UDim2.fromOffset(buttonWidth, 34),
                      LayoutOrder = index,
                      Text = "",
                      Parent = group,
                  })
                  Utilities.Corner(button, self.Library.Tokens.Radius.Medium)
                  local stroke = Utilities.Stroke(button, Color3.new(), 1, 0)
                  local label = Utilities.Create("TextLabel", {
                      BackgroundTransparency = 1,
                      Size = UDim2.fromScale(1, 1),
                      Font = Enum.Font.GothamMedium,
                      Text = themeName,
                      TextSize = 11,
                      TextTruncate = Enum.TextTruncate.AtEnd,
                      Parent = button,
                  })

                  self.Window.ThemeManager:Bind(button, {
                      BackgroundColor3 = function(theme)
                          return self.Value == themeName and theme.Accent or theme.SurfaceElevated
                      end,
                      BackgroundTransparency = function(theme)
                          return self.Value == themeName
                              and (theme.SelectedTransparency or 0.08)
                              or (theme.ElevatedTransparency or 0.14)
                      end,
                  })
                  self.Window.ThemeManager:Bind(stroke, {
                      Color = function(theme)
                          return self.Value == themeName and theme.Accent or theme.Border
                      end,
                      Transparency = "BorderTransparency",
                  })
                  self.Window.ThemeManager:Bind(label, {
                      TextColor3 = function(theme)
                          return self.Value == themeName and theme.AccentForeground or theme.TextSecondary
                      end,
                  })

                  self.Maid:Give(button.Activated:Connect(function()
                      if not self.Disabled then
                          self:SetValue(themeName)
                      end
                  end))
                  self.Buttons[themeName] = { Button = button, Stroke = stroke, Label = label }
              end

              self.Maid:Give(self.Window.ThemeManager.Changed:Connect(function(_, name)
                  self.Value = name
                  self:_refresh(true)
              end))

              if config.Default and config.Default ~= self.Value then
                  self:SetValue(config.Default, true)
              else
                  self:_refresh(false)
              end
              if self.Flag then
                  self.Library.Flags[self.Flag] = self.Value
              end
              return self
          end

          function ThemeSwitcher:_refresh(animate)
              for _, entry in pairs(self.Buttons) do
                  self.Window.ThemeManager:Apply(entry.Button, animate)
                  self.Window.ThemeManager:Apply(entry.Stroke, animate)
                  self.Window.ThemeManager:Apply(entry.Label, animate)
              end
          end

          function ThemeSwitcher:SetValue(themeName, silent)
              if self._destroyed then return self end
              assert(type(themeName) == "string" and self.Library.Themes[themeName], string.format('[Note] Unknown theme "%s"', tostring(themeName)))
              self.Value = themeName
              self.Window:SetTheme(themeName, { PreserveAccent = not self.ResetAccent })
              self:_refresh(true)
              if self.Flag then
                  self.Library.Flags[self.Flag] = themeName
              end
              if not silent then
                  self:_fire(themeName)
              end
              return self
          end

          function ThemeSwitcher:GetValue()
              return self.Value
          end

          return ThemeSwitcher
          ''')

          replace("src/Core/ThemeManager.lua",
          '''function ThemeManager:SetTheme(theme, animate)
              if self._destroyed then
                  return
              end
              local resolved, name = self:Resolve(theme)
          ''',
          '''function ThemeManager:SetTheme(theme, animate, resetAccent)
              if self._destroyed then
                  return
              end
              if resetAccent then
                  self._accentOverride = false
                  self.Accent = nil
              end
              local resolved, name = self:Resolve(theme)
          ''')

          replace("src/Core/ThemeManager.lua",
          '''function ThemeManager:Destroy()
          ''',
          '''function ThemeManager:ClearAccent(animate)
              if self._destroyed then
                  return
              end
              self._accentOverride = false
              self.Accent = self.Theme and self.Theme.Accent or nil
              self:ApplyAll(animate ~= false)
              self.Changed:Fire(self.Theme, self.Name)
          end

          function ThemeManager:Destroy()
          ''')

          replace("src/Note.lua", 'local HttpService = game:GetService("HttpService")\n', 'local HttpService = game:GetService("HttpService")\nlocal Lighting = game:GetService("Lighting")\n')
          replace("src/Note.lua", 'Version = "0.1.0",', 'Version = "0.2.0",')
          replace("src/Note.lua",
          '''    self.Capabilities = Compatibility.Capabilities()
              self._initialized = true
              return self
          end
          ''',
          '''    self.Capabilities = Compatibility.Capabilities()
              self._initialized = true
              self:_applyFrostedGlass(config.FrostedGlass ~= false, config.BlurSize)
              return self
          end
          ''')

          replace("src/Note.lua",
          '''function Note:RegisterTheme(name, theme)
          ''',
          '''function Note:_applyFrostedGlass(enabled, blurSize)
              self.FrostedGlass = enabled == true
              local defaultTheme = self.Themes[self.DefaultTheme] or self.Themes.Dark
              self.BlurSize = tonumber(blurSize) or defaultTheme.GlassBlur or 14
              local blurName = ((self.ScreenGui and self.ScreenGui.Name) or "NoteUI") .. "_FrostedGlass"
              local existing = Lighting:FindFirstChild(blurName)
              if existing and existing ~= self.BlurEffect and existing:GetAttribute("NoteOwned") == true then
                  existing:Destroy()
              end
              if not self.FrostedGlass then
                  if self.BlurEffect then
                      self.BlurEffect:Destroy()
                      self.BlurEffect = nil
                  end
                  return
              end
              if not self.BlurEffect or not self.BlurEffect.Parent then
                  local blur = Instance.new("BlurEffect")
                  blur.Name = blurName
                  blur:SetAttribute("NoteOwned", true)
                  blur.Parent = Lighting
                  self.BlurEffect = blur
              end
              self.BlurEffect.Size = self.BlurSize
          end

          function Note:SetFrostedGlass(enabled, blurSize)
              self:_ensureInitialized()
              self:_applyFrostedGlass(enabled ~= false, blurSize)
              return self
          end

          function Note:RegisterTheme(name, theme)
          ''')

          replace("src/Note.lua",
          '''    if self.Animation then self.Animation:Destroy() end
              if self.ScreenGui then self.ScreenGui:Destroy() end
          ''',
          '''    if self.Animation then self.Animation:Destroy() end
              if self.BlurEffect then
                  self.BlurEffect:Destroy()
                  self.BlurEffect = nil
              end
              if self.ScreenGui then self.ScreenGui:Destroy() end
          ''')

          replace("src/Components/Window.lua",
          '''    self.ThemeManager:Bind(main, { BackgroundColor3 = "Background" })
              self.ThemeManager:Bind(mainStroke, { Color = "Border" })
          ''',
          '''    self.ThemeManager:Bind(main, {
                  BackgroundColor3 = "Background",
                  BackgroundTransparency = "WindowTransparency",
              })
              self.ThemeManager:Bind(mainStroke, {
                  Color = "Border",
                  Transparency = "BorderTransparency",
              })
          ''')

          replace("src/Components/Window.lua",
          '''        self.ThemeManager:Bind(searchFrame, { BackgroundColor3 = "Input" })
                  self.ThemeManager:Bind(searchStroke, { Color = "Border" })
          ''',
          '''        self.ThemeManager:Bind(searchFrame, {
                      BackgroundColor3 = "Input",
                      BackgroundTransparency = "InputTransparency",
                  })
                  self.ThemeManager:Bind(searchStroke, {
                      Color = "Border",
                      Transparency = "BorderTransparency",
                  })
          ''')

          replace("src/Components/Window.lua",
          '''        CanvasSize = UDim2.fromOffset(0, 0),
                  ScrollBarThickness = 2,
                  Parent = sidebar,
          ''',
          '''        CanvasSize = UDim2.fromOffset(0, 0),
                  ScrollBarThickness = 2,
                  ScrollBarImageTransparency = 0.12,
                  VerticalScrollBarInset = Enum.ScrollBarInset.Always,
                  Parent = sidebar,
          ''')
          replace("src/Components/Window.lua", 'Size = UDim2.new(1, -8, 1, -searchTop - 8),', 'Size = UDim2.new(1, -14, 1, -searchTop - 12),')

          replace("src/Components/Window.lua",
          '''function Window:SetTheme(theme)
              self.ThemeManager:SetTheme(theme)
              return self
          end

          function Window:SetAccent(color)
          ''',
          '''function Window:SetTheme(theme, options)
              options = options or {}
              local preserveAccent = type(options) == "table" and options.PreserveAccent == true
              self.ThemeManager:SetTheme(theme, nil, not preserveAccent)
              return self
          end

          function Window:ApplyTheme(theme)
              return self:SetTheme(theme)
          end

          function Window:ClearAccent()
              self.ThemeManager:ClearAccent()
              return self
          end

          function Window:SetAccent(color)
          ''')

          replace("src/Internal/BaseComponent.lua",
          '''    self.Window.ThemeManager:Bind(frame, { BackgroundColor3 = "Surface" })
              self.Window.ThemeManager:Bind(stroke, { Color = "Border" })
          ''',
          '''    self.Window.ThemeManager:Bind(frame, {
                  BackgroundColor3 = "Surface",
                  BackgroundTransparency = function(theme)
                      return self.Disabled and (theme.DisabledTransparency or 0.58) or (theme.SurfaceTransparency or 0)
                  end,
              })
              self.Window.ThemeManager:Bind(stroke, {
                  Color = "Border",
                  Transparency = "BorderTransparency",
              })
          ''')
          replace("src/Internal/BaseComponent.lua", 'self.Window.ThemeManager:Bind(title, { TextColor3 = "Text" })', '''self.Window.ThemeManager:Bind(title, {
                  TextColor3 = function(theme)
                      return self.Disabled and theme.TextMuted or theme.Text
                  end,
              })''')
          replace("src/Internal/BaseComponent.lua", 'self.Window.ThemeManager:Bind(description, { TextColor3 = "TextMuted" })', '''self.Window.ThemeManager:Bind(description, {
                      TextColor3 = function(theme)
                          return self.Disabled and theme.TextMuted or theme.TextMuted
                      end,
                  })''')
          replace("src/Internal/BaseComponent.lua",
          '''    self.Frame.Active = not self.Disabled
              self.Frame.BackgroundTransparency = self.Disabled and self.Library.Tokens.Transparency.Disabled or 0
              return self
          end
          ''',
          '''    self.Frame.Active = not self.Disabled
              self.Window.ThemeManager:Apply(self.Frame, true)
              if self.TitleLabel then self.Window.ThemeManager:Apply(self.TitleLabel, true) end
              if self.DescriptionLabel then self.Window.ThemeManager:Apply(self.DescriptionLabel, true) end
              return self
          end
          ''')

          replace("src/Components/Section.lua", 'local Divider = require("src/Components/Divider")\n', 'local Divider = require("src/Components/Divider")\nlocal ThemeSwitcher = require("src/Components/ThemeSwitcher")\n')
          replace("src/Components/Section.lua",
          '''    self.Window.ThemeManager:Bind(frame, { BackgroundColor3 = "SecondaryBackground" })
              self.Window.ThemeManager:Bind(stroke, { Color = "Border" })
          ''',
          '''    self.Window.ThemeManager:Bind(frame, {
                  BackgroundColor3 = "SecondaryBackground",
                  BackgroundTransparency = "SecondaryTransparency",
              })
              self.Window.ThemeManager:Bind(stroke, {
                  Color = "Border",
                  Transparency = "BorderTransparency",
              })
          ''')
          replace("src/Components/Section.lua",
          '''function Section:CreateDivider(config) return Divider.new(self, config) end
          ''',
          '''function Section:CreateDivider(config) return Divider.new(self, config) end
          function Section:CreateThemeSwitcher(config) return ThemeSwitcher.new(self, config) end
          function Section:CreateThemeButtons(config) return ThemeSwitcher.new(self, config) end
          ''')

          replace("src/Components/Input.lua",
          '''    local self = BaseComponent.new(section, "Input", config, 82)
              setmetatable(self, Input)
          ''',
          '''    local hasDescription = tostring(config.Description or "") ~= ""
              local normalHeight = hasDescription and 88 or 72
              local errorHeight = normalHeight + 24
              local self = BaseComponent.new(section, "Input", config, normalHeight)
              setmetatable(self, Input)
              self._normalHeight = normalHeight
              self._errorHeight = errorHeight
              self._hasDescription = hasDescription
          ''')
          replace("src/Components/Input.lua",
          '''    self:AddTextBlock(-12)

              local boxFrame = Utilities.Create("Frame", {
          ''',
          '''    self:AddTextBlock(-12)
              if not hasDescription then
                  self.TitleLabel.Position = UDim2.fromOffset(12, 6)
                  self.TitleLabel.Size = UDim2.new(1, -24, 0, 20)
              end

              local boxFrame = Utilities.Create("Frame", {
          ''')
          replace("src/Components/Input.lua", 'Position = UDim2.new(0, 12, 1, -38),\n        Size = UDim2.new(1, -24, 0, 30),', 'Position = UDim2.fromOffset(12, hasDescription and 48 or 32),\n        Size = UDim2.new(1, -24, 0, 32),')
          replace("src/Components/Input.lua",
          '''    self.Window.ThemeManager:Bind(boxFrame, { BackgroundColor3 = "Input" })
              self.Window.ThemeManager:Bind(stroke, { Color = "Border" })
          ''',
          '''    self.Window.ThemeManager:Bind(boxFrame, {
                  BackgroundColor3 = "Input",
                  BackgroundTransparency = "InputTransparency",
              })
              self.Window.ThemeManager:Bind(stroke, {
                  Color = function(theme)
                      return self.Error and theme.Destructive or theme.Border
                  end,
                  Transparency = "BorderTransparency",
              })
          ''')
          replace("src/Components/Input.lua", 'TextXAlignment = Enum.TextXAlignment.Left,\n        TextTruncate = Enum.TextTruncate.AtEnd,', 'TextXAlignment = Enum.TextXAlignment.Left,\n        TextYAlignment = Enum.TextYAlignment.Center,\n        TextTruncate = Enum.TextTruncate.AtEnd,', 1)
          replace("src/Components/Input.lua",
          '''        Position = UDim2.new(0, 12, 1, -4),
                  Size = UDim2.new(1, -24, 0, 16),
          ''',
          '''        Position = UDim2.fromOffset(12, normalHeight + 2),
                  Size = UDim2.new(1, -24, 0, 18),
          ''')
          replace("src/Components/Input.lua", 'TextXAlignment = Enum.TextXAlignment.Left,\n        TextTruncate = Enum.TextTruncate.AtEnd,\n        Visible = false,', 'TextXAlignment = Enum.TextXAlignment.Left,\n        TextYAlignment = Enum.TextYAlignment.Center,\n        TextTruncate = Enum.TextTruncate.AtEnd,\n        Visible = false,', 1)
          replace("src/Components/Input.lua",
          '''    self.InputStroke.Color = self.Window.ThemeManager:Get(hasError and "Destructive" or "Border")
              self.Frame.Size = UDim2.new(1, 0, 0, hasError and 100 or 82)
          ''',
          '''    self.Window.ThemeManager:Apply(self.InputStroke, true)
              self.Frame.Size = UDim2.new(1, 0, 0, hasError and self._errorHeight or self._normalHeight)
          ''')

          replace("src/Components/Tab.lua",
          '''    Utilities.Corner(button, self.Library.Tokens.Radius.Medium)
              local indicator = Utilities.Create("Frame", {
          ''',
          '''    Utilities.Corner(button, self.Library.Tokens.Radius.Medium)
              self.Window.ThemeManager:Bind(button, {
                  BackgroundColor3 = function(theme)
                      return self.Window.ActiveTab == self and theme.SurfaceSelected or theme.SurfaceHover
                  end,
                  BackgroundTransparency = function(theme)
                      if self.Disabled then
                          return theme.DisabledTransparency or 0.62
                      elseif self.Window.ActiveTab == self then
                          return theme.SelectedTransparency or 0.08
                      elseif self._hovered then
                          return theme.HoverTransparency or 0.14
                      end
                      return 1
                  end,
              })
              local indicator = Utilities.Create("Frame", {
          ''')
          replace("src/Components/Tab.lua",
          '''                return self.Window.ActiveTab == self and accent or theme.TextSecondary
          ''',
          '''                if self.Disabled then return theme.TextMuted end
                          return self.Window.ActiveTab == self and accent or theme.TextSecondary
          ''')
          replace("src/Components/Tab.lua",
          '''            return self.Window.ActiveTab == self and theme.Text or theme.TextSecondary
          ''',
          '''            if self.Disabled then return theme.TextMuted end
                      return self.Window.ActiveTab == self and theme.Text or theme.TextSecondary
          ''')
          replace("src/Components/Tab.lua",
          '''        BackgroundTransparency = 1,
                  BorderSizePixel = 0,
                  Size = UDim2.fromScale(1, 1),
                  CanvasSize = UDim2.fromOffset(0, 0),
                  ScrollBarThickness = 3,
          ''',
          '''        BackgroundTransparency = 1,
                  BorderSizePixel = 0,
                  Position = UDim2.fromOffset(0, 6),
                  Size = UDim2.new(1, -6, 1, -12),
                  CanvasSize = UDim2.fromOffset(0, 0),
                  ScrollBarThickness = 3,
                  ScrollBarImageTransparency = 0.10,
                  VerticalScrollBarInset = Enum.ScrollBarInset.Always,
          ''')
          replace("src/Components/Tab.lua",
          '''    self.Maid:Give(button.MouseEnter:Connect(function()
                  if self.Window.ActiveTab ~= self and not self.Disabled then
                      self.Library.Animation:Tween(button, { BackgroundTransparency = 0.75 }, self.Library.Tokens.Animation.Fast)
                      button.BackgroundColor3 = self.Window.ThemeManager:Get("SurfaceHover")
                  end
              end))
              self.Maid:Give(button.MouseLeave:Connect(function()
                  if self.Window.ActiveTab ~= self then
                      self.Library.Animation:Tween(button, { BackgroundTransparency = 1 }, self.Library.Tokens.Animation.Fast)
                  end
              end))
          ''',
          '''    self.Maid:Give(button.MouseEnter:Connect(function()
                  self._hovered = true
                  self.Window.ThemeManager:Apply(button, true)
              end))
              self.Maid:Give(button.MouseLeave:Connect(function()
                  self._hovered = false
                  self.Window.ThemeManager:Apply(button, true)
              end))
          ''')
          replace("src/Components/Tab.lua",
          '''    self.Page.Visible = selected
              self.Button.BackgroundColor3 = self.Window.ThemeManager:Get(selected and "SurfaceSelected" or "SurfaceHover")
              self.Library.Animation:Tween(self.Button, {
                  BackgroundTransparency = selected and 0 or 1,
              }, self.Library.Tokens.Animation.Fast)
          ''',
          '''    self.Page.Visible = selected
              self.Window.ThemeManager:Apply(self.Button, true)
          ''')
          replace("src/Components/Tab.lua",
          '''    self.Button.Active = not self.Disabled
              self.Button.BackgroundTransparency = self.Disabled and 0.85 or (self.Window.ActiveTab == self and 0 or 1)
              return self
          end
          ''',
          '''    self.Button.Active = not self.Disabled
              self.Window.ThemeManager:Apply(self.Button, true)
              self.Window.ThemeManager:Apply(self.Label, true)
              if self.IconObject then self.Window.ThemeManager:Apply(self.IconObject.Instance, true) end
              return self
          end
          ''')

          replace("src/Components/Button.lua",
          '''    self.Window.ThemeManager:Bind(action, { BackgroundColor3 = style.Background })
              self.Window.ThemeManager:Bind(actionStroke, { Color = self.Style == "Secondary" and "Border" or style.Background })
          ''',
          '''    self.Window.ThemeManager:Bind(action, {
                  BackgroundColor3 = style.Background,
                  BackgroundTransparency = function(theme)
                      local base = self.Style == "Secondary" and (theme.ElevatedTransparency or 0.14) or 0.04
                      return self._hovered and math.max(0, base - 0.08) or base
                  end,
              })
              self.Window.ThemeManager:Bind(actionStroke, {
                  Color = self.Style == "Secondary" and "Border" or style.Background,
                  Transparency = "BorderTransparency",
              })
          ''')
          replace("src/Components/Button.lua",
          '''    self.Maid:Give(action.MouseEnter:Connect(function()
                  if self.Disabled or self.Loading then return end
                  self.Library.Animation:Tween(action, { BackgroundTransparency = 0.08 }, self.Library.Tokens.Animation.Fast)
              end))
              self.Maid:Give(action.MouseLeave:Connect(function()
                  self.Library.Animation:Tween(action, { BackgroundTransparency = 0 }, self.Library.Tokens.Animation.Fast)
              end))
          ''',
          '''    self.Maid:Give(action.MouseEnter:Connect(function()
                  if self.Disabled or self.Loading then return end
                  self._hovered = true
                  self.Window.ThemeManager:Apply(action, true)
              end))
              self.Maid:Give(action.MouseLeave:Connect(function()
                  self._hovered = false
                  self.Window.ThemeManager:Apply(action, true)
              end))
          ''')

          replace("src/Internal/ScrollContainer.lua",
          '''        ScrollBarThickness = config.ScrollBarThickness or 3,
                  ScrollingDirection = Enum.ScrollingDirection.Y,
          ''',
          '''        ScrollBarThickness = config.ScrollBarThickness or 3,
                  ScrollBarImageTransparency = config.ScrollBarImageTransparency or 0.10,
                  VerticalScrollBarInset = Enum.ScrollBarInset.Always,
                  ScrollingDirection = Enum.ScrollingDirection.Y,
          ''')

          replace("src/Components/Dropdown.lua", 'self.Window.ThemeManager:Bind(selectButton, { BackgroundColor3 = "Input", TextColor3 = "Text" })', 'self.Window.ThemeManager:Bind(selectButton, { BackgroundColor3 = "Input", BackgroundTransparency = "InputTransparency", TextColor3 = "Text" })')
          replace("src/Components/Dropdown.lua",
          '''                BackgroundColor3 = selected and "SurfaceSelected" or "Surface",
                          TextColor3 = "Text",
          ''',
          '''                BackgroundColor3 = selected and "SurfaceSelected" or "Surface",
                          BackgroundTransparency = selected and "SelectedTransparency" or "SurfaceTransparency",
                          TextColor3 = "Text",
          ''')
          replace("src/Components/Dropdown.lua",
          '''            row.MouseEnter:Connect(function()
                          self.Library.Animation:Tween(row, { BackgroundTransparency = 0.08 }, self.Library.Tokens.Animation.Fast)
                      end)
                      row.MouseLeave:Connect(function()
                          self.Library.Animation:Tween(row, { BackgroundTransparency = 0 }, self.Library.Tokens.Animation.Fast)
                      end)
          ''',
          '''            row.MouseEnter:Connect(function()
                          self.Library.Animation:Tween(row, { BackgroundTransparency = math.max(0, row.BackgroundTransparency - 0.08) }, self.Library.Tokens.Animation.Fast)
                      end)
                      row.MouseLeave:Connect(function()
                          self.Window.ThemeManager:Apply(row, true)
                      end)
          ''')

          replace("src/Components/Colorpicker.lua", 'Color3.fromRGB(110, 125, 255)', 'Color3.fromRGB(190, 190, 194)')

          # Apply glass transparency to remaining simple themed surfaces and border strokes.
          for path in Path("src/Components").glob("*.lua"):
              text = read(path)
              text = text.replace('{ BackgroundColor3 = "SurfaceElevated" }', '{ BackgroundColor3 = "SurfaceElevated", BackgroundTransparency = "ElevatedTransparency" }')
              text = text.replace('{ BackgroundColor3 = "Input" }', '{ BackgroundColor3 = "Input", BackgroundTransparency = "InputTransparency" }')
              text = text.replace('{ BackgroundColor3 = "SecondaryBackground" }', '{ BackgroundColor3 = "SecondaryBackground", BackgroundTransparency = "SecondaryTransparency" }')
              text = text.replace('{ Color = "Border" }', '{ Color = "Border", Transparency = "BorderTransparency" }')
              write(path, text)

          # Example synchronization.
          for path in Path("examples").glob("*.lua"):
              text = read(path)
              marker = '))()\n'
              if 'Note:Init({' not in text and marker in text:
                  text = text.replace(marker, marker + '\nNote:Init({\n    Theme = "Dark",\n    FrostedGlass = true,\n    BlurSize = 14,\n})\n', 1)
              write(path, text)

          showcase = read("examples/showcase.lua")
          pattern = re.compile(r'Theme:CreateButton\(\{\n    Name = "Use Dark Theme".*?Theme:CreateButton\(\{\n    Name = "Use Light Theme".*?\n\}\)\n', re.S)
          replacement = '''Theme:CreateThemeButtons({
              Name = "Interface Theme",
              Description = "Switches every bound surface, text, icon, border, and accent token.",
              Themes = { "Dark", "Light" },
              ResetAccent = true,
          })
          '''
          showcase, changed = pattern.subn(replacement, showcase, count=1)
          if changed != 1:
              raise SystemExit("Could not replace showcase theme buttons")
          write("examples/showcase.lua", showcase)

          write("examples/themes.lua", '''local Note = loadstring(game:HttpGet(
              "https://raw.githubusercontent.com/Toluwer/Note/main/main.lua"
          ))()

          Note:Init({
              Theme = "Dark",
              FrostedGlass = true,
              BlurSize = 14,
          })

          local Window = Note:CreateWindow({
              Title = "Theme Lab",
              Subtitle = "Frosted neutral dark and light themes",
              Icon = "palette",
              Theme = "Dark",
              Size = UDim2.fromOffset(620, 450),
              Draggable = true,
              Resizable = true,
          })

          local Appearance = Window:CreateTab({
              Name = "Appearance",
              Icon = "paintbrush",
          })

          local Theme = Appearance:CreateSection({
              Name = "Theme",
              Description = "Switch every theme token or choose an optional custom accent.",
          })

          Theme:CreateThemeButtons({
              Name = "Interface Theme",
              Description = "Dark and Light reset the complete palette, including the accent.",
              Themes = { "Dark", "Light" },
              ResetAccent = true,
          })

          Theme:CreateColorpicker({
              Name = "Accent Color",
              Description = "The picker remains available for an optional custom accent.",
              Default = Color3.fromRGB(190, 190, 194),
              Callback = function(color)
                  Window:SetAccent(color)
              end,
          })

          Theme:CreateButton({
              Name = "Reset Theme Accent",
              Icon = "rotate-ccw",
              Callback = function()
                  Window:ClearAccent()
              end,
          })

          Theme:CreateParagraph({
              Title = "Frosted glass",
              Content = "Note uses translucent theme surfaces plus an owned BlurEffect. Call Note:SetFrostedGlass(false) to disable it.",
          })
          ''')

          readme = read("README.md")
          readme = readme.replace('- Neutral dark and light themes with animated runtime switching', '- Frosted neutral dark and light themes with animated runtime switching')
          readme = readme.replace('- Optional per-window accent colors, inherited custom themes, and theme signals', '- Built-in theme buttons, optional per-window accent colors, inherited custom themes, and theme signals')
          if 'FrostedGlass = true' not in readme:
              readme = readme.replace('''Note:Init({
              Name = "NoteUI",
              Parent = nil,
              ReuseExisting = false,
              DisplayOrder = 1000,
              Theme = "Dark",
          })''', '''Note:Init({
              Name = "NoteUI",
              Parent = nil,
              ReuseExisting = false,
              DisplayOrder = 1000,
              Theme = "Dark",
              FrostedGlass = true,
              BlurSize = 14,
          })''')
          readme = readme.replace('Section:CreateDivider(config)\n', 'Section:CreateDivider(config)\nSection:CreateThemeButtons(config)\nSection:CreateThemeSwitcher(config)\n')
          theme_heading = '''Both built-in themes avoid colored or neon surface treatments. Accent color changes are optional.
          '''
          theme_replacement = '''Both built-in themes avoid colored or neon surface treatments. Accent color changes are optional. `Window:SetTheme` resets the accent to the selected theme by default, so every token changes together. Pass `{ PreserveAccent = true }` only when a custom accent should remain.

          Add ready-made theme buttons:

          ```lua
          ThemeSection:CreateThemeButtons({
              Name = "Interface Theme",
              Themes = { "Dark", "Light" },
              ResetAccent = true,
          })
          ```
          '''
          if theme_heading in readme:
              readme = readme.replace(theme_heading, theme_replacement, 1)
          if '## Frosted glass' not in readme:
              readme = readme.replace('## Lucide icons', '''## Frosted glass

          Frosted glass is enabled by default. Note combines translucent theme surfaces with one owned `BlurEffect` in `Lighting`.

          ```lua
          Note:SetFrostedGlass(true, 14)
          Note:SetFrostedGlass(false)
          ```

          The blur effect is destroyed with `Note:Destroy()` and can be disabled during `Note:Init` with `FrostedGlass = false`.

          ## Lucide icons''')
          write("README.md", readme)

          changelog = read("CHANGELOG.md")
          entry = '''## 0.2.0 - 2026-07-24

          ### Added

          - Frosted-glass rendering with translucent theme tokens and an owned, configurable `BlurEffect`
          - `Section:CreateThemeButtons` / `CreateThemeSwitcher` for ready-made Dark and Light theme controls
          - `Window:ApplyTheme`, `Window:ClearAccent`, and `Note:SetFrostedGlass`

          ### Fixed

          - Validation messages and input fields no longer shift into or clip through each other
          - Page and sidebar scrollbars remain inset from rounded window edges
          - Selected and disabled tabs now re-evaluate every theme-bound color and transparency token
          - Theme switches reset the previous custom accent by default so the entire palette changes together
          - First and last scrolling content no longer clip against the page viewport

          ### Changed

          - Updated every runnable example and the README to use the frosted neutral theme workflow
          - Retained the color picker as the optional custom-accent control

          '''
          if '## 0.2.0' not in changelog:
              changelog = changelog.replace('All notable changes to Note are documented here.\n\n', 'All notable changes to Note are documented here.\n\n' + entry, 1)
          write("CHANGELOG.md", changelog)

          replace("tools/check.py",
          '''        "Dialog", "Tooltip", "Window", "Tab", "Section",
          ''',
          '''        "Dialog", "Tooltip", "Window", "Tab", "Section", "ThemeSwitcher",
          ''')

          workflow = Path(".github/workflows/fix-frosted-theme.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Generate and verify distribution
        run: |
          python tools/bundle.py
          python tools/check.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add frosted glass and synchronized theme controls"
          git push
