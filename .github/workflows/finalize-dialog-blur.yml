name: Finalize dialog blur update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-dialog-blur.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize source and documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Patch target not found in {path}:\n{old}")
              write(path, text.replace(old, new, count))

          replace(
              "src/Note.lua",
              '        Version = "0.2.3",',
              '        Version = "0.2.4",',
          )
          replace(
              "src/Note.lua",
              '''        _flagBindings = {},
                  _initialized = false,
          ''',
              '''        _flagBindings = {},
                  _dialogBlur = nil,
                  _dialogBlurRevision = 0,
                  _initialized = false,
          ''',
          )
          replace(
              "src/Note.lua",
              '''    for i = #self.Notifications, 1, -1 do
          ''',
              '''    self._dialogBlurRevision = (self._dialogBlurRevision or 0) + 1
              if self._dialogBlur then
                  if self.Animation then
                      self.Animation:Cancel(self._dialogBlur)
                  end
                  if self._dialogBlur.Parent then
                      self._dialogBlur:Destroy()
                  end
                  self._dialogBlur = nil
              end

              for i = #self.Notifications, 1, -1 do
          ''',
          )

          replace(
              "README.md",
              "Frosted glass is enabled by default using translucent UI surfaces only. Note does not create a `BlurEffect`, modify `Lighting`, or blur the game view.",
              "Frosted glass is enabled by default using translucent UI surfaces only. It does not blur the game view. Modal dialogs are the sole exception: while a dialog is open, Note can use one temporary, dialog-owned `BlurEffect` to focus attention, and removes it as the dialog closes.",
          )
          replace(
              "README.md",
              '''    Icon = "circle-alert",
                  Buttons = {
          ''',
              '''    Icon = "circle-alert",
                  Blur = true,
                  BlurSize = 14,
                  Buttons = {
          ''',
          )
          replace(
              "README.md",
              "Only the active dialog captures interaction. Escape and the close icon dismiss it.",
              "Only the active dialog captures interaction. The fullscreen interaction blocker is visually transparent; by default the 3D scene blurs smoothly while the dialog is open and returns to sharp focus as it closes. Set `Blur = false` to disable that effect or adjust `BlurSize` from `0` to `56`. Escape and the close icon dismiss the dialog.",
          )
          replace(
              "README.md",
              "Destroying Note removes every Note-owned window, overlay, notification, dialog, global input connection, theme binding, tween, and the owned root GUI.",
              "Destroying Note removes every Note-owned window, overlay, notification, dialog, temporary dialog blur, global input connection, theme binding, tween, and the owned root GUI.",
          )

          replace(
              "examples/showcase.lua",
              '    Description = "Shows a modal confirmation.",',
              '    Description = "Shows a modal confirmation with temporary scene blur.",',
          )
          replace(
              "examples/showcase.lua",
              '''            Icon = "circle-alert",
                          Buttons = {
          ''',
              '''            Icon = "circle-alert",
                          Blur = true,
                          BlurSize = 14,
                          Buttons = {
          ''',
          )

          changelog = read("CHANGELOG.md")
          if "## Unreleased" not in changelog:
              raise SystemExit("Unreleased changelog section not found")
          changelog = changelog.replace("## Unreleased", "## 0.2.4 - 2026-07-24", 1)
          fixed_marker = "### Fixed\n\n"
          fixed_entry = '''### Fixed

          - Dialogs no longer place a dark scrim over the interface or game view
          - Dialogs use one temporary blur that animates in and out and cannot remain stuck in `Lighting`
          - Replacing a dialog reverses the shared blur safely without stacking multiple effects
          - Dialog panels now animate fixed layout geometry through group transparency and scale
          '''
          if fixed_marker not in changelog:
              raise SystemExit("Fixed changelog marker not found")
          changelog = changelog.replace(fixed_marker, fixed_entry, 1)
          changed_marker = "### Changed\n\n"
          changed_entry = '''### Changed

          - Added `Blur` and `BlurSize` dialog options and synchronized the showcase and README
          '''
          if changed_marker not in changelog:
              raise SystemExit("Changed changelog marker not found")
          changelog = changelog.replace(changed_marker, changed_entry, 1)
          write("CHANGELOG.md", changelog)

          workflow = Path(".github/workflows/finalize-dialog-blur.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Generate and verify distribution
        run: |
          python tools/bundle.py
          python tools/check.py

      - name: Commit synchronized update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: add temporary dialog blur"
          git push
