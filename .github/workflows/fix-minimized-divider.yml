name: Apply minimized divider and documentation fixes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-minimized-divider.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          window_path = Path("src/Components/Window.lua")
          window = window_path.read_text(encoding="utf-8")

          replacements = {
              '''    self.SearchBox = searchBox
              self.ResizeHandle = resizeHandle
          ''': '''    self.SearchBox = searchBox
              self.ResizeHandle = resizeHandle
              self.TitleDivider = divider
          ''',
              '''    self._restoreSize = self.Main.Size
              if self.ResizeHandle then self.ResizeHandle.Visible = false end
          ''': '''    self._restoreSize = self.Main.Size
              if self.TitleDivider then self.TitleDivider.Visible = false end
              if self.ResizeHandle then self.ResizeHandle.Visible = false end
          ''',
              '''    self.Library.Animation:Tween(self.Main, {
                  Size = self._restoreSize or UDim2.fromOffset(620, 450),
              }, self.Library.Tokens.Animation.Normal)
              self.DragController:SetEnabled(self.Draggable)
          ''': '''    self.Library.Animation:Tween(self.Main, {
                  Size = self._restoreSize or UDim2.fromOffset(620, 450),
              }, self.Library.Tokens.Animation.Normal)
              task.delay(self.Library.Tokens.Animation.Normal, function()
                  if not self._destroyed and not self.Minimized and self.TitleDivider then
                      self.TitleDivider.Visible = true
                  end
              end)
              self.DragController:SetEnabled(self.Draggable)
          ''',
          }

          for old, new in replacements.items():
              if old not in window:
                  raise SystemExit(f"Window patch target not found:\n{old}")
              window = window.replace(old, new, 1)

          window_path.write_text(window, encoding="utf-8")

          for name in ("basic.lua", "showcase.lua"):
              path = Path("examples") / name
              text = path.read_text(encoding="utf-8")
              text = text.replace('    Accent = Color3.fromRGB(176, 176, 180),\n', '', 1)
              path.write_text(text, encoding="utf-8")

          notifications_path = Path("examples/notifications.lua")
          notifications = notifications_path.read_text(encoding="utf-8")
          old_notifications = '''    Theme = "Dark",
              Size = UDim2.fromOffset(560, 400),
          '''
          new_notifications = '''    Theme = "Dark",
              Size = UDim2.fromOffset(560, 400),
              Draggable = true,
              Resizable = true,
          '''
          if old_notifications not in notifications:
              raise SystemExit("Notifications example patch target not found")
          notifications_path.write_text(notifications.replace(old_notifications, new_notifications, 1), encoding="utf-8")

          themes = '''local Note = loadstring(game:HttpGet(
              "https://raw.githubusercontent.com/Toluwer/Note/main/main.lua"
          ))()

          local Window = Note:CreateWindow({
              Title = "Theme Lab",
              Subtitle = "Neutral dark and light themes",
              Icon = "palette",
              Theme = "Dark",
              Size = UDim2.fromOffset(620, 450),
              Draggable = true,
              Resizable = true,
          })

          local Appearance = Window:CreateTab({
              Name = "Appearance",
              Icon = "paintbrush",
          })

          local Theme = Appearance:CreateSection({
              Name = "Theme",
              Description = "Switch between the neutral built-in themes or choose an accent color.",
          })

          Theme:CreateButton({
              Name = "Use Dark Theme",
              Icon = "moon",
              Callback = function()
                  Window:SetTheme("Dark")
              end,
          })

          Theme:CreateButton({
              Name = "Use Light Theme",
              Icon = "sun",
              Callback = function()
                  Window:SetTheme("Light")
              end,
          })

          Theme:CreateColorpicker({
              Name = "Accent Color",
              Description = "Accent colors are optional; the default themes remain neutral.",
              Default = Color3.fromRGB(176, 176, 180),
              Callback = function(color)
                  Window:SetAccent(color)
              end,
          })

          Theme:CreateParagraph({
              Title = "Theme behavior",
              Content = "Dark and Light use grayscale surfaces by default. The color picker changes only the optional accent color.",
          })
          '''
          Path("examples/themes.lua").write_text(themes, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              '- Dark and light themes with animated runtime switching\n- Per-window themes, custom accents, inherited custom themes, and theme signals\n',
              '- Neutral dark and light themes with animated runtime switching\n- Optional per-window accent colors, inherited custom themes, and theme signals\n',
              1,
          )
          readme = readme.replace('    Accent = Color3.fromRGB(176, 176, 180),\n', '', 1)
          marker = '- Deterministic bundler that generates the committed single-file distribution\n\n'
          note = ('- Deterministic bundler that generates the committed single-file distribution\n\n'
                  '`Dark` and `Light` intentionally use neutral grayscale defaults. Accent color is opt-in through '
                  '`Window:SetAccent` or a color picker; the color picker remains a supported built-in component.\n\n')
          if marker not in readme:
              raise SystemExit("README feature marker not found")
          readme = readme.replace(marker, note, 1)
          readme = readme.replace(
              'Built-in themes:\n\n- `Dark`\n- `Light`\n',
              'Built-in themes:\n\n- `Dark` — neutral charcoal and gray surfaces\n- `Light` — neutral white and gray surfaces\n\nBoth built-in themes avoid colored or neon surface treatments. Accent color changes are optional.\n',
              1,
          )
          readme = readme.replace(
              'Only the active dialog should capture interaction.',
              'Only the active dialog should capture interaction.',
          )
          readme_path.write_text(readme, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          release = '''## 0.1.1 - 2026-07-24

          ### Fixed

          - Removed the title-bar divider while minimized so it cannot protrude through rounded corners
          - Restored the divider only after the window finishes expanding

          ### Changed

          - Synchronized all examples with the neutral Dark and Light defaults
          - Removed default window accent overrides from the basic and showcase examples
          - Updated the theme example to focus on Dark, Light, and the retained color picker
          - Updated README theme guidance to make accent colors explicitly opt-in

          '''
          marker = '## 0.1.0 - 2026-07-24\n'
          if marker not in changelog:
              raise SystemExit("Changelog marker not found")
          changelog = changelog.replace(marker, release + marker, 1)
          changelog_path.write_text(changelog, encoding="utf-8")

          workflow = Path(".github/workflows/fix-minimized-divider.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Generate and verify distribution
        run: |
          python tools/bundle.py
          python tools/check.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: hide minimized divider and sync examples"
          git push
