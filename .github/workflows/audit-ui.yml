name: Audit UI behavior

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-ui.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate UI audit
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('src')
          animation_terms = (
              'Animation:Tween', 'Animation:Cancel', 'task.delay',
              ':Open()', ':Close()', 'function ',
          )
          accent_terms = ('Accent', 'accent', 'SetAccent', 'ResetAccent', 'PreserveAccent')

          animation = []
          accent = []
          for path in sorted(root.rglob('*.lua')):
              lines = path.read_text().splitlines()
              for number, line in enumerate(lines, 1):
                  if any(term in line for term in ('Animation:Tween', 'Animation:Cancel', 'task.delay')):
                      animation.append(f'{path}:{number}: {line.strip()}')
                  if any(term in line for term in accent_terms):
                      accent.append(f'{path}:{number}: {line.strip()}')

          for path in [Path('examples/showcase.lua'), Path('README.md'), Path('docs/ADVANCED_COMPONENTS.md')]:
              if not path.exists():
                  continue
              lines = path.read_text().splitlines()
              for number, line in enumerate(lines, 1):
                  if any(term in line for term in accent_terms):
                      accent.append(f'{path}:{number}: {line.strip()}')

          out = Path('.audit')
          out.mkdir(exist_ok=True)
          (out / 'animation.txt').write_text('\n'.join(animation) + '\n')
          (out / 'accent.txt').write_text('\n'.join(accent) + '\n')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .audit
          git commit -m "chore: record UI behavior audit"
          git push
