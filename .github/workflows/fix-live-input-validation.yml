name: Fix live input validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-live-input-validation.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply validation fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Patch target not found in {path}:\n{old}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          input_path = "src/Components/Input.lua"

          replace(input_path,
          '''        if self.Flag then
                      self.Library.Flags[self.Flag] = value
                  end
                  Utilities.SafeCallback(self.Type, self.Name .. " Changed", self.ChangedCallback, value)
          ''',
          '''        if self.Error then
                      local valid = self:_validateValue(value)
                      if valid then
                          self:SetError(nil)
                      end
                  end
                  if self.Flag then
                      self.Library.Flags[self.Flag] = value
                  end
                  Utilities.SafeCallback(self.Type, self.Name .. " Changed", self.ChangedCallback, value)
          ''')

          replace(input_path,
          '''    self.Maid:Give(textBox.FocusLost:Connect(function(enterPressed)
                  local valid = true
                  local message
                  if type(self.Validator) == "function" then
                      local ok, result, validationMessage = Utilities.SafeCallback(
                          self.Type,
                          self.Name .. " Validation",
                          self.Validator,
                          self.Value
                      )
                      valid = ok and result ~= false
                      message = validationMessage
                  end
                  self:SetError(valid and nil or (message or "Invalid value"))
                  if valid then
                      self:_fire(self.Value)
                  end
              end))
          ''',
          '''    self.Maid:Give(textBox.FocusLost:Connect(function(enterPressed)
                  local valid, message = self:_validateValue(self.Value)
                  self:SetError(valid and nil or (message or "Invalid value"))
                  if valid then
                      self:_fire(self.Value)
                  end
              end))
          ''')

          replace(input_path,
          '''function Input:SetError(message)
          ''',
          '''function Input:_validateValue(value)
              if type(self.Validator) ~= "function" then
                  return true, nil
              end
              local ok, result, message = Utilities.SafeCallback(
                  self.Type,
                  self.Name .. " Validation",
                  self.Validator,
                  value
              )
              return ok and result ~= false, message
          end

          function Input:SetError(message)
          ''')

          replace(input_path,
          '''    if self.PasswordMask then
                  self.PasswordMask.Text = self.Revealed and "" or string.rep("•", #value)
                  self.PasswordMask.Visible = not self.Revealed
                  self.PasswordMask.TextTransparency = self.Revealed and 1 or 0
              end
              if self.Flag then
          ''',
          '''    if self.PasswordMask then
                  self.PasswordMask.Text = self.Revealed and "" or string.rep("•", #value)
                  self.PasswordMask.Visible = not self.Revealed
                  self.PasswordMask.TextTransparency = self.Revealed and 1 or 0
              end
              if self.Error then
                  local valid = self:_validateValue(value)
                  if valid then
                      self:SetError(nil)
                  end
              end
              if self.Flag then
          ''', 1)

          showcase = Path("examples/showcase.lua")
          text = showcase.read_text(encoding="utf-8")
          old = '''Data:CreateInput({
              Name = "Password",
              Description = "Password masking with official eye icons.",
              Placeholder = "Password",
              Password = true,
              CharacterLimit = 32,
          })
          '''
          new = '''Data:CreateInput({
              Name = "Password",
              Description = "Password masking with live validation recovery.",
              Placeholder = "Password",
              Password = true,
              CharacterLimit = 32,
              Validate = function(value)
                  return #value >= 3, "Use at least three characters."
              end,
          })
          '''
          if old not in text:
              raise SystemExit("Showcase password example target not found")
          showcase.write_text(text.replace(old, new, 1), encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = '`Callback` runs on submission. `Changed` runs when accepted text changes. Password inputs render either the mask or the real text—never both—and keep that state synchronized during typing and `SetValue`.'
          new = '`Callback` runs on submission. `Changed` runs when accepted text changes. Once validation has displayed an error, normal and password inputs re-check while typing and clear the error immediately when valid. Password inputs render either the mask or the real text—never both—and keep that state synchronized during typing and `SetValue`.'
          if old not in text:
              raise SystemExit("README input sentence target not found")
          readme.write_text(text.replace(old, new, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "### Fixed\n\n"
          entry = "- Input validation errors now clear immediately once the typed value becomes valid\n- Live validation recovery applies equally to normal and password fields\n- Programmatic `SetValue` calls also clear an existing error when the new value is valid\n"
          if marker not in text:
              raise SystemExit("Changelog fixed section not found")
          changelog.write_text(text.replace(marker, marker + entry, 1), encoding="utf-8")

          note = Path("src/Note.lua")
          text = note.read_text(encoding="utf-8")
          if 'Version = "0.2.3",' in text:
              note.write_text(text.replace('Version = "0.2.3",', 'Version = "0.2.4",', 1), encoding="utf-8")

          workflow = Path(".github/workflows/fix-live-input-validation.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Generate and verify distribution
        run: |
          python tools/bundle.py
          python tools/check.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clear input validation errors while typing"
          git push
