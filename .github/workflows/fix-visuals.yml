name: Apply visual and dragging fixes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-visuals.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          dark = '''return {
              Name = "Dark",
              Background = Color3.fromRGB(20, 20, 21),
              SecondaryBackground = Color3.fromRGB(24, 24, 25),
              Surface = Color3.fromRGB(29, 29, 30),
              SurfaceElevated = Color3.fromRGB(34, 34, 35),
              Input = Color3.fromRGB(25, 25, 26),
              SurfaceHover = Color3.fromRGB(38, 38, 39),
              SurfaceSelected = Color3.fromRGB(44, 44, 46),
              Border = Color3.fromRGB(54, 54, 56),
              Text = Color3.fromRGB(242, 242, 243),
              TextSecondary = Color3.fromRGB(188, 188, 190),
              TextMuted = Color3.fromRGB(140, 140, 144),
              Accent = Color3.fromRGB(176, 176, 180),
              AccentForeground = Color3.fromRGB(20, 20, 21),
              Destructive = Color3.fromRGB(214, 72, 82),
              Warning = Color3.fromRGB(204, 145, 57),
              Success = Color3.fromRGB(62, 158, 105),
              Scrollbar = Color3.fromRGB(88, 88, 92),
              Shadow = Color3.fromRGB(0, 0, 0),
          }
          '''

          light = '''return {
              Name = "Light",
              Background = Color3.fromRGB(246, 246, 247),
              SecondaryBackground = Color3.fromRGB(239, 239, 240),
              Surface = Color3.fromRGB(255, 255, 255),
              SurfaceElevated = Color3.fromRGB(251, 251, 252),
              Input = Color3.fromRGB(245, 245, 246),
              SurfaceHover = Color3.fromRGB(238, 238, 239),
              SurfaceSelected = Color3.fromRGB(229, 229, 231),
              Border = Color3.fromRGB(211, 211, 214),
              Text = Color3.fromRGB(28, 28, 30),
              TextSecondary = Color3.fromRGB(82, 82, 86),
              TextMuted = Color3.fromRGB(122, 122, 127),
              Accent = Color3.fromRGB(47, 47, 50),
              AccentForeground = Color3.fromRGB(255, 255, 255),
              Destructive = Color3.fromRGB(190, 48, 58),
              Warning = Color3.fromRGB(157, 101, 20),
              Success = Color3.fromRGB(34, 126, 76),
              Scrollbar = Color3.fromRGB(158, 158, 163),
              Shadow = Color3.fromRGB(28, 28, 30),
          }
          '''

          drag = '''local UserInputService = game:GetService("UserInputService")
          local Maid = require("src/Core/Maid")
          local Utilities = require("src/Core/Utilities")

          local DragController = {}
          DragController.__index = DragController

          local function toVector2(position)
              return Vector2.new(position.X, position.Y)
          end

          local function round(value)
              return math.floor(value + 0.5)
          end

          function DragController.new(target, handle, config)
              config = config or {}
              local self = setmetatable({
                  Target = target,
                  Handle = handle,
                  Enabled = config.Enabled ~= false,
                  Clamp = config.Clamp ~= false,
                  Ignore = config.Ignore or {},
                  _maid = Maid.new(),
                  _dragging = false,
                  _dragInput = nil,
                  _pointerOffset = Vector2.zero,
                  _destroyed = false,
              }, DragController)

              self._maid:Give(handle.InputBegan:Connect(function(input)
                  if not self.Enabled or self._destroyed then
                      return
                  end
                  if input.UserInputType ~= Enum.UserInputType.MouseButton1
                      and input.UserInputType ~= Enum.UserInputType.Touch then
                      return
                  end

                  local point = toVector2(input.Position)
                  for _, ignored in ipairs(self.Ignore) do
                      if Utilities.PointInGui(point, ignored) then
                          return
                      end
                  end

                  self._dragging = true
                  self._dragInput = input
                  self._pointerOffset = point - target.AbsolutePosition
              end))

              self._maid:Give(UserInputService.InputChanged:Connect(function(input)
                  if not self._dragging or self._destroyed or not target.Parent then
                      return
                  end

                  local isMouseDrag = self._dragInput
                      and self._dragInput.UserInputType == Enum.UserInputType.MouseButton1
                      and input.UserInputType == Enum.UserInputType.MouseMovement
                  local isTouchDrag = self._dragInput
                      and self._dragInput.UserInputType == Enum.UserInputType.Touch
                      and input == self._dragInput

                  if not isMouseDrag and not isTouchDrag then
                      return
                  end

                  local point = toVector2(input.Position)
                  local topLeft = point - self._pointerOffset
                  local parent = target.Parent

                  if self.Clamp then
                      local parentPosition = parent.AbsolutePosition
                      local parentSize = parent.AbsoluteSize
                      local targetSize = target.AbsoluteSize
                      local visibleWidth = math.min(96, targetSize.X)
                      local visibleHeight = math.min(handle.AbsoluteSize.Y, targetSize.Y)

                      topLeft = Vector2.new(
                          Utilities.Clamp(
                              topLeft.X,
                              parentPosition.X - targetSize.X + visibleWidth,
                              parentPosition.X + parentSize.X - visibleWidth
                          ),
                          Utilities.Clamp(
                              topLeft.Y,
                              parentPosition.Y,
                              parentPosition.Y + parentSize.Y - visibleHeight
                          )
                      )
                  end

                  local parentPosition = parent.AbsolutePosition
                  local targetSize = target.AbsoluteSize
                  local anchor = target.AnchorPoint
                  local anchorPosition = topLeft - parentPosition + Vector2.new(
                      targetSize.X * anchor.X,
                      targetSize.Y * anchor.Y
                  )

                  target.Position = UDim2.fromOffset(round(anchorPosition.X), round(anchorPosition.Y))
              end))

              self._maid:Give(UserInputService.InputEnded:Connect(function(input)
                  if not self._dragging then
                      return
                  end

                  local endedMouse = self._dragInput
                      and self._dragInput.UserInputType == Enum.UserInputType.MouseButton1
                      and input.UserInputType == Enum.UserInputType.MouseButton1
                  local endedTouch = self._dragInput
                      and self._dragInput.UserInputType == Enum.UserInputType.Touch
                      and input == self._dragInput

                  if endedMouse or endedTouch then
                      self._dragging = false
                      self._dragInput = nil
                  end
              end))

              return self
          end

          function DragController:SetEnabled(enabled)
              self.Enabled = enabled == true
              if not self.Enabled then
                  self._dragging = false
                  self._dragInput = nil
              end
          end

          function DragController:Destroy()
              if self._destroyed then
                  return
              end
              self._destroyed = true
              self._dragging = false
              self._dragInput = nil
              self._maid:Destroy()
          end

          return DragController
          '''

          Path("src/Themes/Dark.lua").write_text(dark, encoding="utf-8")
          Path("src/Themes/Light.lua").write_text(light, encoding="utf-8")
          Path("src/Internal/DragController.lua").write_text(drag, encoding="utf-8")

          window_path = Path("src/Components/Window.lua")
          window = window_path.read_text(encoding="utf-8")

          replacements = {
              '''        BackgroundColor3 = Color3.new(),
                  BorderSizePixel = 0,
                  Size = UDim2.new(1, 0, 0, library.Tokens.Size.TitleBar),''': '''        BackgroundColor3 = Color3.new(),
                  BackgroundTransparency = 1,
                  BorderSizePixel = 0,
                  Size = UDim2.new(1, 0, 0, library.Tokens.Size.TitleBar),''',
              '''        BackgroundColor3 = Color3.new(),
                  BorderSizePixel = 0,
                  Size = UDim2.new(0, sidebarWidth, 1, 0),''': '''        BackgroundColor3 = Color3.new(),
                  BackgroundTransparency = 1,
                  BorderSizePixel = 0,
                  Size = UDim2.new(0, sidebarWidth, 1, 0),''',
              '''    mainStroke.ZIndex = 120
          ''': '''''',
              '''    self._restoreSize = self.Main.Size
              self._restorePosition = self.Main.Position
              self.DragController:SetEnabled(false)
          ''': '''    self._restoreSize = self.Main.Size
          ''',
              '''        Size = self._restoreSize or UDim2.fromOffset(620, 450),
                  Position = self._restorePosition or self.Main.Position,
          ''': '''        Size = self._restoreSize or UDim2.fromOffset(620, 450),
          ''',
          }

          for old, new in replacements.items():
              if old not in window:
                  raise SystemExit(f"Window patch target not found:\n{old}")
              window = window.replace(old, new, 1)

          window_path.write_text(window, encoding="utf-8")

          neutral_replacements = {
              "Color3.fromRGB(110, 125, 255)": "Color3.fromRGB(176, 176, 180)",
              "Color3.fromRGB(118, 132, 255)": "Color3.fromRGB(176, 176, 180)",
              "Color3.fromRGB(94, 111, 238)": "Color3.fromRGB(47, 47, 50)",
              "Color3.fromRGB(123, 105, 255)": "Color3.fromRGB(176, 176, 180)",
              "Color3.fromRGB(135, 95, 255)": "Color3.fromRGB(176, 176, 180)",
              "Color3.fromRGB(140, 100, 255)": "Color3.fromRGB(176, 176, 180)",
          }

          for path in [Path("README.md"), *Path("examples").glob("*.lua")]:
              text = path.read_text(encoding="utf-8")
              for old, new in neutral_replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/fix-visuals.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Generate and verify distribution
        run: |
          python tools/bundle.py
          python tools/check.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: neutral themes, rounded shell, and dragging"
          git push
