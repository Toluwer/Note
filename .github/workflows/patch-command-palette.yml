name: Patch command palette shortcut

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-command-palette.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Change command palette shortcut to F12
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "src/Components/CommandPalette.lua",
              "local key = config.OpenKey or Enum.KeyCode.P",
              "local key = config.OpenKey or Enum.KeyCode.F12",
          )
          replace_exact(
              "src/Components/CommandPalette.lua",
              "local modifier = config.Modifier\n    if modifier == false then return key.Name end",
              "local modifier = config.Modifier\n    if modifier == nil then modifier = false end\n    if modifier == false then return key.Name end",
          )
          replace_exact(
              "src/Components/CommandPalette.lua",
              "self.OpenKey = config.OpenKey or Enum.KeyCode.P",
              "self.OpenKey = config.OpenKey or Enum.KeyCode.F12",
          )
          replace_exact(
              "src/Components/CommandPalette.lua",
              "if self.Modifier == nil then self.Modifier = Enum.KeyCode.LeftControl end",
              "if self.Modifier == nil then self.Modifier = false end",
          )

          replace_exact(
              "examples/showcase.lua",
              "Description = \"Search and execute actions with Ctrl + P.\",\n    OpenKey = Enum.KeyCode.P,",
              "Description = \"Search and execute actions with F12.\",\n    OpenKey = Enum.KeyCode.F12,\n    Modifier = false,",
          )

          replace_exact(
              "docs/advanced-components.md",
              "OpenKey = Enum.KeyCode.P,\n    Modifier = Enum.KeyCode.LeftControl,\n    Shortcut = \"Ctrl + P\",",
              "OpenKey = Enum.KeyCode.F12,\n    Modifier = false,\n    Shortcut = \"F12\",",
          )
          replace_exact(
              "docs/advanced-components.md",
              "While open, use Up and Down to move through results, Enter to execute, and Escape to close. Set `Modifier = false` to use the open key without a modifier.",
              "The default shortcut is `F12`. While open, use Up and Down to move through results, Enter to execute, and Escape to close.",
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = "- Changed the command palette default shortcut from `Ctrl + P` to `F12`\n"
          if entry not in text:
              marker = "### Changed\n\n"
              if marker not in text:
                  raise SystemExit("missing changelog Changed section")
              text = text.replace(marker, marker + entry, 1)
              changelog.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Components/CommandPalette.lua examples/showcase.lua docs/advanced-components.md CHANGELOG.md
          git commit -m "fix: use F12 for command palette"
          git push
