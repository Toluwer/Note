name: Polish UI behavior

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/polish-ui.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply UI cleanup
        id: migrate
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/polish.log 2>&1
          from pathlib import Path
          from textwrap import dedent
          import re

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def sub(path, pattern, replacement, label, flags=re.S):
              text = load(path)
              updated, count = re.subn(pattern, dedent(replacement).lstrip('\n'), text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'patch target not found: {label}')
              save(path, updated)

          save('src/Core/ThemeManager.lua', dedent('''
              local Signal = require("src/Core/Signal")
              local Utilities = require("src/Core/Utilities")

              local ThemeManager = {}
              ThemeManager.__index = ThemeManager

              function ThemeManager.new(library, theme)
                  local self = setmetatable({
                      Library = library,
                      Name = nil,
                      Theme = nil,
                      Bindings = setmetatable({}, { __mode = "k" }),
                      Changed = Signal.new(),
                      _destroyed = false,
                  }, ThemeManager)
                  self:SetTheme(theme or library.DefaultTheme or "Dark", false)
                  return self
              end

              function ThemeManager:Resolve(theme)
                  if type(theme) == "string" then
                      local registered = self.Library.Themes[theme]
                      assert(registered, string.format('[Note] Unknown theme "%s"', theme))
                      return Utilities.DeepCopy(registered), theme
                  elseif type(theme) == "table" then
                      local parentName = theme.Inherits or self.Library.DefaultTheme or "Dark"
                      local parent = self.Library.Themes[parentName] or self.Library.Themes.Dark
                      local resolved = Utilities.Merge(parent, theme)
                      return resolved, resolved.Name or "Custom"
                  end
                  error("[Note] Theme must be a registered theme name or table", 3)
              end

              function ThemeManager:Get(token)
                  return self.Theme[token]
              end

              function ThemeManager:Bind(instance, propertyMap)
                  if self._destroyed or not instance then return end
                  self.Bindings[instance] = propertyMap
                  self:Apply(instance, false)
              end

              function ThemeManager:Unbind(instance)
                  self.Bindings[instance] = nil
              end

              function ThemeManager:Apply(instance, animate)
                  local map = self.Bindings[instance]
                  if not map or not instance.Parent then return end
                  local properties = {}
                  for property, token in pairs(map) do
                      local value = type(token) == "function"
                          and token(self.Theme, self.Theme.Accent)
                          or self:Get(token)
                      if property == "BackgroundTransparency"
                          and self.Library.FrostedGlass == false
                          and type(value) == "number"
                          and value < 0.5 then
                          value = 0
                      end
                      if value ~= nil then properties[property] = value end
                  end
                  if animate and self.Library.Animation then
                      self.Library.Animation:Tween(instance, properties, self.Library.Tokens.Animation.Normal)
                  else
                      for property, value in pairs(properties) do
                          local ok, err = pcall(function() instance[property] = value end)
                          if not ok then warn("[Note] Theme binding failed:", err) end
                      end
                  end
              end

              function ThemeManager:ApplyAll(animate)
                  for instance in pairs(self.Bindings) do self:Apply(instance, animate) end
              end

              function ThemeManager:SetTheme(theme, animate)
                  if self._destroyed then return end
                  local resolved, name = self:Resolve(theme)
                  self.Theme = resolved
                  self.Name = name
                  self:ApplyAll(animate ~= false)
                  self.Changed:Fire(self.Theme, self.Name)
              end

              function ThemeManager:Destroy()
                  if self._destroyed then return end
                  self._destroyed = true
                  table.clear(self.Bindings)
                  self.Changed:Destroy()
              end

              return ThemeManager
          ''').lstrip())

          note = load('src/Note.lua')
          note = note.replace('Version = "0.3.0"', 'Version = "0.3.1"')
          note = note.replace('ThemeManager.new(self, self.DefaultTheme, config.Accent)', 'ThemeManager.new(self, self.DefaultTheme)')
          note, n = re.subn(
              r'function Note:SetDefaultTheme\(theme, accent\).*?\nend\n\n(?=function Note:CreateWindow)',
              dedent('''
                  function Note:SetDefaultTheme(theme)
                      self:_ensureInitialized()
                      self.GlobalThemeManager:SetTheme(theme)
                      self.DefaultTheme = type(theme) == "string" and theme or self.DefaultTheme
                      return self
                  end

              ''').lstrip(),
              note,
              count=1,
              flags=re.S,
          )
          if n != 1: raise RuntimeError('patch target not found: Note:SetDefaultTheme')
          save('src/Note.lua', note)

          window = load('src/Components/Window.lua')
          window = window.replace('        _tabOrder = 0,\n        _destroyed = false,', '        _tabOrder = 0,\n        _minimizeRevision = 0,\n        _destroyed = false,', 1)
          window = window.replace('ThemeManager.new(library, config.Theme or library.DefaultTheme, config.Accent)', 'ThemeManager.new(library, config.Theme or library.DefaultTheme)', 1)
          window, n = re.subn(
              r'function Window:SetTheme\(theme, options\).*?\nend\n\n(?=function Window:Show)',
              dedent('''
                  function Window:SetTheme(theme)
                      self.ThemeManager:SetTheme(theme)
                      return self
                  end

                  function Window:ApplyTheme(theme)
                      return self:SetTheme(theme)
                  end

              ''').lstrip(),
              window,
              count=1,
              flags=re.S,
          )
          if n != 1: raise RuntimeError('patch target not found: Window theme API')
          window, n = re.subn(
              r'function Window:Minimize\(\).*?\nend\n\nfunction Window:Restore\(\).*?\nend\n\n(?=function Window:ToggleMinimized)',
              dedent('''
                  function Window:Minimize()
                      if self._destroyed or self.Minimized then return self end
                      self.Minimized = true
                      self._minimizeRevision += 1
                      local revision = self._minimizeRevision
                      self._restoreSize = self.Main.Size
                      if self.TitleDivider then self.TitleDivider.Visible = false end
                      if self.ResizeHandle then self.ResizeHandle.Visible = false end
                      local targetWidth = math.max(300, math.min(self.Main.AbsoluteSize.X, 420))
                      local tween = self.Library.Animation:Tween(
                          self.Main,
                          { Size = UDim2.fromOffset(targetWidth, self.Library.Tokens.Size.TitleBar) },
                          self.Library.Tokens.Animation.Normal,
                          Enum.EasingStyle.Quint,
                          Enum.EasingDirection.InOut
                      )
                      local function finish()
                          if not self._destroyed and revision == self._minimizeRevision and self.Minimized and self.Body then
                              self.Body.Visible = false
                          end
                      end
                      if tween then
                          local connection
                          connection = tween.Completed:Connect(function(state)
                              if connection then connection:Disconnect() end
                              if state == Enum.PlaybackState.Completed then finish() end
                          end)
                      else
                          finish()
                      end
                      self.MinimizedChanged:Fire(true)
                      return self
                  end

                  function Window:Restore()
                      if self._destroyed or not self.Minimized then return self end
                      self.Minimized = false
                      self._minimizeRevision += 1
                      local revision = self._minimizeRevision
                      self.Body.Visible = true
                      local tween = self.Library.Animation:Tween(
                          self.Main,
                          { Size = self._restoreSize or UDim2.fromOffset(620, 450) },
                          self.Library.Tokens.Animation.Normal,
                          Enum.EasingStyle.Quint,
                          Enum.EasingDirection.InOut
                      )
                      local function finish()
                          if not self._destroyed and revision == self._minimizeRevision and not self.Minimized and self.TitleDivider then
                              self.TitleDivider.Visible = true
                          end
                      end
                      if tween then
                          local connection
                          connection = tween.Completed:Connect(function(state)
                              if connection then connection:Disconnect() end
                              if state == Enum.PlaybackState.Completed then finish() end
                          end)
                      else
                          finish()
                      end
                      self.DragController:SetEnabled(self.Draggable)
                      if self.ResizeHandle then self.ResizeHandle.Visible = true end
                      self.MinimizedChanged:Fire(false)
                      return self
                  end

              ''').lstrip(),
              window,
              count=1,
              flags=re.S,
          )
          if n != 1: raise RuntimeError('patch target not found: window minimize/restore')
          save('src/Components/Window.lua', window)

          switcher = load('src/Components/ThemeSwitcher.lua')
          switcher = switcher.replace('    self.ResetAccent = config.ResetAccent ~= false\n', '')
          switcher = switcher.replace('self.Window:SetTheme(themeName, { PreserveAccent = not self.ResetAccent })', 'self.Window:SetTheme(themeName)')
          save('src/Components/ThemeSwitcher.lua', switcher)

          button = load('src/Components/Button.lua')
          button = button.replace(
              '    local actionStroke = Utilities.Stroke(action, Color3.new(), 1, 0)\n',
              '    local actionStroke = Utilities.Stroke(action, Color3.new(), 1, 0)\n    local pressScale = Utilities.Create("UIScale", { Scale = 1, Parent = action })\n',
              1,
          )
          button, n = re.subn(
              r'    self\.Maid:Give\(action\.MouseLeave:Connect\(function\(\).*?\n    end\)\)\n    self\.Maid:Give\(action\.MouseButton1Down:Connect\(function\(\).*?\n    end\)\)\n    self\.Maid:Give\(action\.MouseButton1Up:Connect\(function\(\).*?\n    end\)\)',
              dedent('''
                      local function setPressed(pressed)
                          self.Library.Animation:Tween(
                              pressScale,
                              { Scale = pressed and 0.97 or 1 },
                              self.Library.Tokens.Animation.Fast,
                              Enum.EasingStyle.Quint,
                              Enum.EasingDirection.Out
                          )
                      end
                      self.Maid:Give(action.MouseLeave:Connect(function()
                          self._hovered = false
                          setPressed(false)
                          self.Window.ThemeManager:Apply(action, true)
                      end))
                      self.Maid:Give(action.MouseButton1Down:Connect(function()
                          if self.Disabled or self.Loading then return end
                          setPressed(true)
                      end))
                      self.Maid:Give(action.MouseButton1Up:Connect(function()
                          setPressed(false)
                      end))
              ''').rstrip(),
              button,
              count=1,
              flags=re.S,
          )
          if n != 1: raise RuntimeError('patch target not found: button press animation')
          save('src/Components/Button.lua', button)

          dropdown = load('src/Components/Dropdown.lua')
          dropdown = dropdown.replace(
              '    if self._popup then\n        self:_animatePopup(true, revision)\n',
              '    if self._popup then\n        if self._popupMaid and self._repositionPopup then\n            self._repositionPopup()\n            self._popupMaid:Replace("AnchorTracking", RunService.Heartbeat:Connect(self._repositionPopup))\n        end\n        self:_animatePopup(true, revision)\n',
              1,
          )
          dropdown = dropdown.replace(
              '    reposition()\n    maid:Give(RunService.Heartbeat:Connect(reposition))\n',
              '    self._repositionPopup = reposition\n    reposition()\n    maid:Replace("AnchorTracking", RunService.Heartbeat:Connect(reposition))\n',
              1,
          )
          dropdown = dropdown.replace(
              '    self._isOpen = false\n    self._popupRevision += 1\n    self:_animatePopup(false, self._popupRevision)\n',
              '    self._isOpen = false\n    self._popupRevision += 1\n    if self._popupMaid then self._popupMaid:Replace("AnchorTracking", nil) end\n    self:_animatePopup(false, self._popupRevision)\n',
              1,
          )
          save('src/Components/Dropdown.lua', dropdown)

          notification = load('src/Components/Notification.lua')
          notification, n = re.subn(
              r'    self\.Library\.Animation:Tween\(self\.Frame, \{.*?\n    library:_removeNotification\(self\)',
              dedent('''
                      local duration = self.Library.Tokens.Animation.Normal
                      local tween = self.Library.Animation:Tween(self.Frame, {
                          Position = UDim2.new(1, hiddenOffset, 0, self.Frame.Position.Y.Offset),
                          BackgroundTransparency = 1,
                      }, duration, Enum.EasingStyle.Quint, Enum.EasingDirection.In)
                      local frame = self.Frame
                      local library = self.Library
                      local finalized = false
                      local function finalize()
                          if finalized then return end
                          finalized = true
                          self.Maid:Destroy()
                          if frame and frame.Parent then frame:Destroy() end
                      end
                      if tween then
                          local connection
                          connection = tween.Completed:Connect(function()
                              if connection then connection:Disconnect() end
                              finalize()
                          end)
                      end
                      task.delay(duration + 0.05, finalize)
                      library:_removeNotification(self)
              ''').rstrip(),
              notification,
              count=1,
              flags=re.S,
          )
          if n != 1: raise RuntimeError('patch target not found: notification dismissal')
          save('src/Components/Notification.lua', notification)

          dialog = load('src/Components/Dialog.lua')
          dialog = dialog.replace('Enum.EasingDirection.In\n    )\n    task.delay(duration + 0.04, destroyOwnedBlur)', 'Enum.EasingDirection.In\n    )\n    task.delay(duration + 0.05, destroyOwnedBlur)', 1)
          dialog, n = re.subn(
              r'    self\.Library\.Animation:Tween\(\n        panel,.*?\n    task\.delay\(duration \+ 0\.04, function\(\)\n        self\.Maid:Destroy\(\)\n    end\)',
              dedent('''
                      local fade = self.Library.Animation:Tween(
                          panel,
                          { GroupTransparency = 1 },
                          duration,
                          Enum.EasingStyle.Quint,
                          Enum.EasingDirection.InOut
                      )
                      self.Library.Animation:Tween(
                          panelScale,
                          { Scale = 0.97 },
                          duration,
                          Enum.EasingStyle.Quint,
                          Enum.EasingDirection.InOut
                      )
                      local finalized = false
                      local function finalize()
                          if finalized then return end
                          finalized = true
                          self.Maid:Destroy()
                      end
                      if fade then
                          local connection
                          connection = fade.Completed:Connect(function()
                              if connection then connection:Disconnect() end
                              finalize()
                          end)
                      end
                      task.delay(duration + 0.05, finalize)
              ''').rstrip(),
              dialog,
              count=1,
              flags=re.S,
          )
          if n != 1: raise RuntimeError('patch target not found: dialog close animation')
          save('src/Components/Dialog.lua', dialog)

          showcase = load('examples/showcase.lua')
          showcase = showcase.replace('Runtime theme and accent switching.', 'Runtime theme switching and standalone color selection.')
          showcase, n = re.subn(
              r'Theme:CreateColorpicker\(\{.*?\n\}\)\n\nTheme:CreateThemeButtons',
              dedent('''
                  Theme:CreateColorpicker({
                      Name = "Color Picker",
                      Description = "Standalone hue, saturation, value, RGB, hex, and alpha selection.",
                      Flag = "selectedColor",
                      Default = Color3.fromRGB(176, 176, 180),
                      ShowAlpha = true,
                      Callback = function(color, alpha)
                          print("Selected color:", color, "alpha:", alpha)
                      end,
                  })

                  Theme:CreateThemeButtons
              ''').lstrip(),
              showcase,
              count=1,
              flags=re.S,
          )
          if n != 1: raise RuntimeError('patch target not found: showcase color picker')
          showcase = showcase.replace('surface, text, icon, border, and accent token', 'surface, text, icon, border, and selection token')
          showcase = showcase.replace('    ResetAccent = true,\n', '')
          save('examples/showcase.lua', showcase)

          readme = load('README.md')
          readme = readme.replace('optional per-window accent colors, ', '')
          readme = re.sub(r'`Dark` and `Light` intentionally use neutral grayscale defaults\..*?component\.\n', '`Dark` and `Light` use fixed neutral grayscale selection colors. The color picker is a standalone value control and does not recolor the interface.\n', readme)
          readme = readme.replace('| `Accent` | `Color3?` | Per-window accent |\n', '')
          readme = re.sub(r'^Window:SetAccent\([^\n]*\)\n', '', readme, flags=re.M)
          readme = readme.replace('    Name = "Accent",', '    Name = "Color",')
          readme = readme.replace('        Window:SetAccent(color)', '        print(color, alpha)')
          readme = re.sub(r'Both built-in themes avoid colored or neon surface treatments\..*?remain\.', 'Both built-in themes avoid colored or neon surface treatments. Their selection colors are fixed neutral theme tokens and cannot be overridden at runtime.', readme)
          readme = readme.replace('    ResetAccent = true,\n', '')
          save('README.md', readme)

          changelog = load('CHANGELOG.md')
          entry = '- Removed runtime accent overrides; color pickers are standalone value controls and themes keep fixed neutral selection tokens.\n- Audited animated controls and made button presses, dropdown dismissal, window minimize/restore, notifications, and dialogs interruption-safe and completion-driven.\n'
          if entry not in changelog:
              changelog = changelog.replace('## [Unreleased]\n', '## [Unreleased]\n' + entry, 1)
          save('CHANGELOG.md', changelog)

          for path in (Path('.audit/animation.txt'), Path('.audit/accent.txt'), Path('.github/workflows/audit-ui.yml')):
              if path.exists(): path.unlink()
          if Path('.audit').exists() and not any(Path('.audit').iterdir()): Path('.audit').rmdir()

          scan = '\n'.join(path.read_text() for path in Path('src').rglob('*.lua')) + load('examples/showcase.lua')
          for token in ('SetAccent', 'ClearAccent', 'ResetAccent', 'PreserveAccent', 'config.Accent', '_accentOverride'):
              if token in scan: raise RuntimeError(f'forbidden accent API remains: {token}')
          print('UI polish migration complete')
          PY
          code=$?
          if [ "$code" -ne 0 ]; then
            cp /tmp/polish.log .polish-error.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .polish-error.txt
            git commit -m "chore: record UI polish migration failure"
            git push
            exit "$code"
          fi
          rm -f .polish-error.txt

      - name: Build and verify distribution
        run: |
          python tools/bundle.py
          python tools/check.py

      - name: Commit polished runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: polish animations and remove accent overrides"
          git push
