name: Apply compact notifications and no-screen-blur glass

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-notifications-no-screen-blur.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source, example, and documentation changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8")

          notification = '''local Utilities = require("src/Core/Utilities")
          local Maid = require("src/Core/Maid")
          local Icons = require("src/Core/Icons")
          local TextMeasure = require("src/Internal/TextMeasure")

          local Notification = {}
          Notification.__index = Notification

          local function ceil(value)
              return math.ceil(value + 0.0001)
          end

          function Notification.new(library, config, themeManager)
              config = config or {}
              local kind = tostring(config.Type or "Info")
              local titleText = tostring(config.Title or kind)
              local contentText = tostring(config.Content or "")
              local minimumWidth = tonumber(config.MinWidth) or 220
              local maximumWidth = math.max(minimumWidth, tonumber(config.MaxWidth) or 380)

              local self = setmetatable({
                  Library = library,
                  ThemeManager = themeManager or library.GlobalThemeManager,
                  Maid = Maid.new(),
                  Duration = tonumber(config.Duration) or 4,
                  _destroyed = false,
              }, Notification)

              local titleNatural = TextMeasure.Get(titleText, 13, Enum.Font.GothamMedium, 1000)
              local contentNatural = TextMeasure.Get(contentText, 11, Enum.Font.Gotham, 1000)
              local desiredTextWidth = math.max(titleNatural.X, math.min(contentNatural.X, maximumWidth - 28))
              local width = Utilities.Clamp(ceil(desiredTextWidth + 48), minimumWidth, maximumWidth)
              local titleWidth = width - 58
              local contentWidth = width - 28
              local titleMeasure = TextMeasure.Get(titleText, 13, Enum.Font.GothamMedium, titleWidth)
              local titleHeight = math.max(20, ceil(titleMeasure.Y))
              local contentMeasure = TextMeasure.Get(contentText, 11, Enum.Font.Gotham, contentWidth)
              local contentHeight = contentText ~= "" and math.max(16, ceil(contentMeasure.Y)) or 0
              local contentTop = 12 + titleHeight + 4
              local height = contentText ~= ""
                  and math.max(54, contentTop + contentHeight + 12)
                  or math.max(50, 12 + titleHeight + 12)

              local frame = Utilities.Create("Frame", {
                  Name = "Notification",
                  BackgroundColor3 = Color3.new(),
                  BorderSizePixel = 0,
                  Size = UDim2.fromOffset(width, height),
                  AnchorPoint = Vector2.new(1, 0),
                  ZIndex = 410,
                  Parent = library.Overlay:GetLayer("Notifications"),
              })
              Utilities.Corner(frame, library.Tokens.Radius.Large)
              local stroke = Utilities.Stroke(frame, Color3.new(), 1, 0)
              self.ThemeManager:Bind(frame, {
                  BackgroundColor3 = "SurfaceElevated",
                  BackgroundTransparency = "ElevatedTransparency",
              })
              self.ThemeManager:Bind(stroke, {
                  Color = "Border",
                  Transparency = "BorderTransparency",
              })

              local title = Utilities.Create("TextLabel", {
                  BackgroundTransparency = 1,
                  Position = UDim2.fromOffset(14, 10),
                  Size = UDim2.fromOffset(titleWidth, titleHeight),
                  Font = Enum.Font.GothamMedium,
                  Text = titleText,
                  TextSize = 13,
                  TextWrapped = true,
                  TextXAlignment = Enum.TextXAlignment.Left,
                  TextYAlignment = Enum.TextYAlignment.Top,
                  ZIndex = 411,
                  Parent = frame,
              })
              self.ThemeManager:Bind(title, { TextColor3 = "Text" })

              if contentText ~= "" then
                  local content = Utilities.Create("TextLabel", {
                      BackgroundTransparency = 1,
                      Position = UDim2.fromOffset(14, contentTop),
                      Size = UDim2.fromOffset(contentWidth, contentHeight),
                      Font = Enum.Font.Gotham,
                      Text = contentText,
                      TextSize = 11,
                      TextWrapped = true,
                      TextXAlignment = Enum.TextXAlignment.Left,
                      TextYAlignment = Enum.TextYAlignment.Top,
                      ZIndex = 411,
                      Parent = frame,
                  })
                  self.ThemeManager:Bind(content, { TextColor3 = "TextSecondary" })
                  self.ContentLabel = content
              end

              local closeButton = Utilities.Create("TextButton", {
                  BackgroundTransparency = 1,
                  Text = "",
                  AnchorPoint = Vector2.new(1, 0),
                  Position = UDim2.new(1, -6, 0, 6),
                  Size = UDim2.fromOffset(28, 28),
                  ZIndex = 412,
                  Parent = frame,
              })
              local closeIcon = Icons.Create({ Name = "x", Size = 14, Parent = closeButton, ZIndex = 413 })
              closeIcon.Instance.AnchorPoint = Vector2.new(0.5, 0.5)
              closeIcon.Instance.Position = UDim2.fromScale(0.5, 0.5)
              self.ThemeManager:Bind(closeIcon.Instance, { ImageColor3 = "TextMuted" })

              self.Frame = frame
              self.TitleLabel = title
              self.Width = width
              self.Maid:Give(frame)
              self.Maid:Give(closeIcon)
              self.Maid:Give(closeButton.Activated:Connect(function()
                  self:Dismiss()
              end))

              local hiddenOffset = width + 24
              frame.Position = UDim2.new(1, hiddenOffset, 0, 16)
              library:_layoutNotifications()
              library.Animation:Tween(frame, {
                  Position = UDim2.new(1, -16, 0, frame.Position.Y.Offset),
              }, library.Tokens.Animation.Slow, Enum.EasingStyle.Quint)

              if self.Duration > 0 then
                  self._timer = task.delay(self.Duration, function()
                      self:Dismiss()
                  end)
                  self.Maid:Give(self._timer)
              end
              return self
          end

          function Notification:Dismiss()
              if self._destroyed then return end
              self._destroyed = true
              local hiddenOffset = (self.Width or self.Frame.AbsoluteSize.X) + 24
              self.Library.Animation:Tween(self.Frame, {
                  Position = UDim2.new(1, hiddenOffset, 0, self.Frame.Position.Y.Offset),
                  BackgroundTransparency = 1,
              }, self.Library.Tokens.Animation.Normal)
              local frame = self.Frame
              local library = self.Library
              task.delay(self.Library.Tokens.Animation.Normal, function()
                  self.Maid:Destroy()
                  if frame and frame.Parent then
                      frame:Destroy()
                  end
              end)
              library:_removeNotification(self)
          end

          function Notification:Destroy()
              self:Dismiss()
          end

          return Notification
          '''
          write("src/Components/Notification.lua", notification)

          note_path = Path("src/Note.lua")
          note = note_path.read_text(encoding="utf-8")
          note = note.replace('local Lighting = game:GetService("Lighting")\n', '')
          note = note.replace('Version = "0.2.0",', 'Version = "0.2.1",')
          note = note.replace('self:_applyFrostedGlass(config.FrostedGlass ~= false, config.BlurSize)', 'self:_applyFrostedGlass(config.FrostedGlass ~= false)')
          note = re.sub(
              r'function Note:_applyFrostedGlass\(enabled, blurSize\).*?function Note:RegisterTheme',
              '''function Note:_applyFrostedGlass(enabled)
              self.FrostedGlass = enabled == true
              if self.GlobalThemeManager then
                  self.GlobalThemeManager:ApplyAll(true)
              end
              for _, window in ipairs(self.Windows) do
                  if window and not window._destroyed and window.ThemeManager then
                      window.ThemeManager:ApplyAll(true)
                  end
              end
          end

          function Note:SetFrostedGlass(enabled)
              self:_ensureInitialized()
              self:_applyFrostedGlass(enabled ~= false)
              return self
          end

          function Note:RegisterTheme''',
              note,
              count=1,
              flags=re.S,
          )
          note = note.replace('''    if self.BlurEffect then
                  self.BlurEffect:Destroy()
                  self.BlurEffect = nil
              end
          ''', '')
          note_path.write_text(note, encoding="utf-8")

          theme_path = Path("src/Core/ThemeManager.lua")
          theme = theme_path.read_text(encoding="utf-8")
          old = '''        if value ~= nil then
                      properties[property] = value
                  end
          '''
          new = '''        if property == "BackgroundTransparency"
                      and self.Library.FrostedGlass == false
                      and type(value) == "number"
                      and value < 0.5 then
                      value = 0
                  end
                  if value ~= nil then
                      properties[property] = value
                  end
          '''
          if old not in theme:
              raise SystemExit("ThemeManager patch target not found")
          theme = theme.replace(old, new, 1)
          theme_path.write_text(theme, encoding="utf-8")

          for theme_file in (Path("src/Themes/Dark.lua"), Path("src/Themes/Light.lua")):
              text = theme_file.read_text(encoding="utf-8")
              text = re.sub(r'^\s*GlassBlur\s*=\s*\d+,\n', '', text, flags=re.M)
              theme_file.write_text(text, encoding="utf-8")

          for example in Path("examples").glob("*.lua"):
              text = example.read_text(encoding="utf-8")
              text = text.replace('    BlurSize = 14,\n', '')
              text = text.replace(
                  'Note uses translucent theme surfaces plus an owned BlurEffect. Call Note:SetFrostedGlass(false) to disable it.',
                  'Note uses translucent UI surfaces only. It never adds a Lighting blur or blurs the game view.'
              )
              example.write_text(text, encoding="utf-8")

          notifications_path = Path("examples/notifications.lua")
          notifications = notifications_path.read_text(encoding="utf-8")
          if 'Name = "Long Message"' not in notifications:
              notifications += '''

          Types:CreateButton({
              Name = "Long Message",
              Icon = "align-left",
              Callback = function()
                  Note:Notify({
                      Title = "Compact notification",
                      Content = "Longer notification text wraps onto additional lines and increases the card height instead of stretching across the screen.",
                      Duration = 7,
                  })
              end,
          })
          '''
          notifications_path.write_text(notifications, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              'Frosted glass is enabled by default. Note combines translucent theme surfaces with one owned `BlurEffect` in `Lighting`.',
              'Frosted glass is enabled by default using translucent UI surfaces only. Note does not create a `BlurEffect`, modify `Lighting`, or blur the game view.'
          )
          readme = readme.replace('Note:SetFrostedGlass(true, 14)', 'Note:SetFrostedGlass(true)')
          readme = readme.replace(
              'The blur effect is destroyed with `Note:Destroy()` and can be disabled during `Note:Init` with `FrostedGlass = false`.',
              'Set `FrostedGlass = false` during `Note:Init`, or call `Note:SetFrostedGlass(false)`, to make the glass surfaces opaque.'
          )
          readme = readme.replace(
              'Notifications stack inside the viewport, animate in and out, include a progress indicator, and support manual dismissal.',
              'Notifications size themselves from their title and content, wrap longer messages into additional height, stack inside the viewport, animate in and out, and support manual dismissal. They have no leading status icon or progress strip.'
          )
          readme_path.write_text(readme, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          entry = '''## 0.2.1 - 2026-07-24

          ### Fixed

          - Notifications now use content-aware compact widths and grow vertically for wrapped text
          - Removed the notification progress strip and leading status icon
          - Frosted glass no longer creates a `Lighting.BlurEffect` or blurs the game view

          ### Changed

          - `Note:SetFrostedGlass` now switches between translucent and opaque UI surfaces only
          - Updated notification examples and documentation to match the compact card design

          '''
          marker = '## 0.2.0 - 2026-07-24\n'
          if '## 0.2.1 - 2026-07-24' not in changelog:
              changelog = changelog.replace(marker, entry + marker, 1)
          changelog_path.write_text(changelog, encoding="utf-8")

          workflow = Path(".github/workflows/fix-notifications-no-screen-blur.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Generate and verify distribution
        run: |
          python tools/bundle.py
          python tools/check.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: compact notifications without screen blur"
          git push
