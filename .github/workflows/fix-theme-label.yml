name: Correct showcase theme label

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-theme-label.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("examples/showcase.lua")
          text = path.read_text(encoding="utf-8")
          old = 'Description = "Switch between the built-in neutral themes.",'
          new = 'Description = "Test representative built-in color themes.",'
          if old not in text:
              raise SystemExit("theme description not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit label
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/showcase.lua
          git commit -m "docs: correct showcase theme description"
          git push
