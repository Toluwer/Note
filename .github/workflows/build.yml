name: Build distribution

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tools/bundle.py"
      - "tools/check.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply palette overlay migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          command_path = Path("src/Components/CommandPalette.lua")
          command = command_path.read_text()
          if "self:AddTextBlock(-170)" in command:
              pattern = re.compile(
                  r"    self\._selectedIndex = 1\n"
                  r"    self\._filtered = \{\}\n"
                  r"    self\._resultRows = \{\}\n"
                  r"    self:AddTextBlock\(-170\)\n.*?"
                  r"(?=    self\.Maid:Give\(UserInputService\.InputBegan:Connect)",
                  re.S,
              )
              replacement = '''    self._selectedIndex = 1
    self._filtered = {}
    self._resultRows = {}

    -- Headless control: no section row is rendered.
    self.Visible = false
    self.Frame.Visible = false
    self.Frame.Size = UDim2.fromOffset(0, 0)
    if self.Stroke then self.Stroke.Enabled = false end

'''
              command, count = pattern.subn(replacement, command, count=1)
              assert count == 1, "failed to remove visible command-palette row"
          command = command.replace(
              "        if processed or self.Disabled or input.KeyCode ~= self.OpenKey then return end\n",
              '''        if self.Disabled or input.KeyCode ~= self.OpenKey then return end
        if UserInputService:GetFocusedTextBox() then return end
''',
              1,
          )
          if "function CommandPalette:SetVisible(_value)" not in command:
              command = command.replace(
                  '''function CommandPalette:GetCommands()
    return table.clone(self.Commands)
end

function CommandPalette:Destroy()
''',
                  '''function CommandPalette:GetCommands()
    return table.clone(self.Commands)
end

function CommandPalette:SetVisible(_value)
    self.Visible = false
    if self.Frame then self.Frame.Visible = false end
    return self
end

function CommandPalette:Destroy()
''',
                  1,
              )
          command_path.write_text(command)

          color_path = Path("src/Components/Colorpicker.lua")
          color = color_path.read_text()
          if "self._popupRevision = 0" not in color:
              color = color.replace(
                  "    self.Hue, self.Saturation, self.Brightness = self.Value:ToHSV()\n",
                  "    self.Hue, self.Saturation, self.Brightness = self.Value:ToHSV()\n    self._popupRevision = 0\n",
                  1,
              )
          if 'Utilities.Create("CanvasGroup", {' not in color:
              color = color.replace(
                  '''    local popup = Utilities.Create("Frame", {
        Name = "ColorpickerPopup",
        BackgroundColor3 = Color3.new(),
        BorderSizePixel = 0,
        Size = UDim2.fromOffset(320, height),
        ZIndex = 205,
        Parent = self.Library.Overlay:GetLayer("Popovers"),
    })
''',
                  '''    self._popupRevision += 1
    local popup = Utilities.Create("CanvasGroup", {
        Name = "ColorpickerPopup",
        BackgroundColor3 = Color3.new(),
        BorderSizePixel = 0,
        Size = UDim2.fromOffset(320, height),
        GroupTransparency = 1,
        ClipsDescendants = true,
        ZIndex = 205,
        Parent = self.Library.Overlay:GetLayer("Popovers"),
    })
''',
                  1,
              )
              color = color.replace("    maid:Give(popup)\n", "", 1)
              color = color.replace(
                  '    self.Window.ThemeManager:Bind(popupStroke, { Color = "Border", Transparency = "BorderTransparency" })\n',
                  '''    self.Window.ThemeManager:Bind(popupStroke, { Color = "Border", Transparency = "BorderTransparency" })
    local popupScale = Utilities.Create("UIScale", {
        Scale = 0.965,
        Parent = popup,
    })
''',
                  1,
              )
              color = color.replace(
                  "    self._popup = popup\n    self._sv = sv\n",
                  "    self._popup = popup\n    self._popupScale = popupScale\n    self._sv = sv\n",
                  1,
              )
              pattern = re.compile(
                  r"    reposition\(\)\n"
                  r"    maid:Give\(RunService\.Heartbeat:Connect\(reposition\)\)\n.*?"
                  r"function Colorpicker:Toggle\(\)",
                  re.S,
              )
              replacement = '''    reposition()
    maid:Replace("AnchorTracking", RunService.Heartbeat:Connect(reposition))
    maid:Give(self.Library.InputManager:RegisterOutside({ popup, self.Preview }, function() self:Close() end))
    maid:Give(self.Library.InputManager:PushEscape(function() self:Close() end))

    self.Library.Animation:Cancel(popup)
    self.Library.Animation:Cancel(popupScale)
    self.Library.Animation:Tween(popup, { GroupTransparency = 0 }, self.Library.Tokens.Animation.Normal, Enum.EasingStyle.Quint, Enum.EasingDirection.Out)
    self.Library.Animation:Tween(popupScale, { Scale = 1 }, self.Library.Tokens.Animation.Normal, Enum.EasingStyle.Quint, Enum.EasingDirection.Out)
    return self
end

function Colorpicker:Close()
    if not self._popup then return self end

    local popup = self._popup
    local popupScale = self._popupScale
    local popupMaid = self._popupMaid
    self._popup = nil
    self._popupScale = nil
    self._popupMaid = nil
    self._popupRevision += 1

    if popupMaid then popupMaid:Destroy() end
    self.Library.Animation:Cancel(popup)
    if popupScale then self.Library.Animation:Cancel(popupScale) end

    local duration = self.Library.Tokens.Animation.Normal
    local fade = self.Library.Animation:Tween(popup, { GroupTransparency = 1 }, duration, Enum.EasingStyle.Quint, Enum.EasingDirection.InOut)
    if popupScale then
        self.Library.Animation:Tween(popupScale, { Scale = 0.965 }, duration, Enum.EasingStyle.Quint, Enum.EasingDirection.InOut)
    end

    local finalized = false
    local function finalize()
        if finalized then return end
        finalized = true
        if popup and popup.Parent then popup:Destroy() end
    end
    if fade then
        local connection
        connection = fade.Completed:Connect(function()
            if connection then connection:Disconnect() end
            finalize()
        end)
    end
    task.delay(duration + 0.05, finalize)

    self._fields = nil
    self._alphaGradient = nil
    self._alphaBar = nil
    self._alphaCursor = nil
    return self
end

function Colorpicker:Toggle()'''
              color, count = pattern.subn(replacement, color, count=1)
              assert count == 1, "failed to replace color-picker animation"
          color_path.write_text(color)
          PY

      - name: Generate and verify distribution
        run: |
          python tools/bundle.py
          python tools/check.py

      - name: Commit source migration and distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Components/CommandPalette.lua src/Components/Colorpicker.lua main.lua
          if ! git diff --cached --quiet; then
            git commit -m "fix: make command palette headless and smooth color picker"
            git push
          fi
