name: Build distribution

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add optional split tab layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f"{label}: source block not found")
              return text.replace(old, new, 1)

          tab_path = Path("src/Components/Tab.lua")
          tab = tab_path.read_text(encoding="utf-8")

          tab = replace_once(
              tab,
              'local Tab = {}\nTab.__index = Tab\n',
              '''local Tab = {}
          Tab.__index = Tab

          local function normalizeLayout(value)
              return string.lower(tostring(value or "Single")) == "split" and "Split" or "Single"
          end

          local function normalizeSide(value)
              return string.lower(tostring(value or "Left")) == "right" and "Right" or "Left"
          end
          ''',
              "Tab layout helpers",
          )

          tab = replace_once(
              tab,
              '''        Icon = config.Icon,
                  Disabled = config.Disabled == true,
          ''',
              '''        Icon = config.Icon,
                  Layout = normalizeLayout(config.Layout or (config.Split and "Split" or "Single")),
                  StackAt = tonumber(config.StackAt),
                  SplitGap = math.max(4, tonumber(config.SplitGap) or 12),
                  Disabled = config.Disabled == true,
          ''',
              "Tab configuration",
          )

          tab = replace_once(
              tab,
              '''        _layoutOrder = 0,
                  _destroyed = false,
          ''',
              '''        _layoutOrder = 0,
                  _stacked = false,
                  _destroyed = false,
          ''',
              "Tab layout state",
          )

          page_pattern = re.compile(
              r'    local page = Utilities\.Create\("ScrollingFrame", \{.*?\n    local empty = Utilities\.Create\("TextLabel", \{',
              re.S,
          )
          page_replacement = '''    local page = Utilities.Create("ScrollingFrame", {
              Name = "Page_" .. self.Name,
              BackgroundTransparency = 1,
              BorderSizePixel = 0,
              Position = UDim2.fromOffset(0, 6),
              Size = UDim2.new(1, -6, 1, -12),
              CanvasSize = UDim2.fromOffset(0, 0),
              ScrollBarThickness = 3,
              ScrollBarImageTransparency = 0.10,
              VerticalScrollBarInset = Enum.ScrollBarInset.Always,
              ScrollingDirection = Enum.ScrollingDirection.Y,
              Visible = false,
              Parent = window.Pages,
          })
          self.Window.ThemeManager:Bind(page, { ScrollBarImageColor3 = "Scrollbar" })

          local content = Utilities.Create("Frame", {
              Name = "Content",
              BackgroundTransparency = 1,
              BorderSizePixel = 0,
              Position = UDim2.fromOffset(14, 14),
              Size = UDim2.new(1, -28, 0, 0),
              Parent = page,
          })

          local singleColumn = Utilities.Create("Frame", {
              Name = "SingleColumn",
              BackgroundTransparency = 1,
              BorderSizePixel = 0,
              Size = UDim2.new(1, 0, 0, 0),
              Visible = self.Layout == "Single",
              Parent = content,
          })
          local singleList = Utilities.List(singleColumn, Enum.FillDirection.Vertical, 12)

          local splitRoot = Utilities.Create("Frame", {
              Name = "SplitColumns",
              BackgroundTransparency = 1,
              BorderSizePixel = 0,
              Size = UDim2.new(1, 0, 0, 0),
              Visible = self.Layout == "Split",
              Parent = content,
          })

          local leftColumn = Utilities.Create("Frame", {
              Name = "LeftColumn",
              BackgroundTransparency = 1,
              BorderSizePixel = 0,
              Position = UDim2.fromOffset(0, 0),
              Size = UDim2.new(0.5, -6, 0, 0),
              Parent = splitRoot,
          })
          local leftList = Utilities.List(leftColumn, Enum.FillDirection.Vertical, 12)

          local rightColumn = Utilities.Create("Frame", {
              Name = "RightColumn",
              BackgroundTransparency = 1,
              BorderSizePixel = 0,
              Position = UDim2.new(0.5, 6, 0, 0),
              Size = UDim2.new(0.5, -6, 0, 0),
              Parent = splitRoot,
          })
          local rightList = Utilities.List(rightColumn, Enum.FillDirection.Vertical, 12)

          local function updatePageLayout()
              if self._destroyed then return end

              local height = 0
              local split = self.Layout == "Split"
              singleColumn.Visible = not split
              splitRoot.Visible = split

              if not split then
                  height = math.max(0, singleList.AbsoluteContentSize.Y)
                  singleColumn.Position = UDim2.fromOffset(0, 0)
                  singleColumn.Size = UDim2.new(1, 0, 0, height)
                  self._stacked = false
              else
                  local gap = self.SplitGap
                  local leftHeight = math.max(0, leftList.AbsoluteContentSize.Y)
                  local rightHeight = math.max(0, rightList.AbsoluteContentSize.Y)
                  local availableWidth = math.max(0, content.AbsoluteSize.X)
                  local stacked = self.StackAt ~= nil and self.StackAt > 0 and availableWidth < self.StackAt
                  self._stacked = stacked

                  if stacked then
                      local between = leftHeight > 0 and rightHeight > 0 and gap or 0
                      leftColumn.Position = UDim2.fromOffset(0, 0)
                      leftColumn.Size = UDim2.new(1, 0, 0, leftHeight)
                      rightColumn.Position = UDim2.fromOffset(0, leftHeight + between)
                      rightColumn.Size = UDim2.new(1, 0, 0, rightHeight)
                      height = leftHeight + between + rightHeight
                  else
                      local halfGap = gap * 0.5
                      leftColumn.Position = UDim2.fromOffset(0, 0)
                      leftColumn.Size = UDim2.new(0.5, -halfGap, 0, leftHeight)
                      rightColumn.Position = UDim2.new(0.5, halfGap, 0, 0)
                      rightColumn.Size = UDim2.new(0.5, -halfGap, 0, rightHeight)
                      height = math.max(leftHeight, rightHeight)
                  end

                  splitRoot.Size = UDim2.new(1, 0, 0, height)
              end

              content.Size = UDim2.new(1, -28, 0, height)
              page.CanvasSize = UDim2.fromOffset(0, height + 28)
          end

          self.Maid:Give(page:GetPropertyChangedSignal("AbsoluteSize"):Connect(updatePageLayout))
          self.Maid:Give(singleList:GetPropertyChangedSignal("AbsoluteContentSize"):Connect(updatePageLayout))
          self.Maid:Give(leftList:GetPropertyChangedSignal("AbsoluteContentSize"):Connect(updatePageLayout))
          self.Maid:Give(rightList:GetPropertyChangedSignal("AbsoluteContentSize"):Connect(updatePageLayout))

          local empty = Utilities.Create("TextLabel", {'''

          tab, count = page_pattern.subn(page_replacement, tab, count=1)
          if count != 1:
              raise RuntimeError("Tab page layout block was not found")

          tab = replace_once(
              tab,
              '''    self.Page = page
              self.PageContent = page
              self.PageList = pageList
              self.EmptyState = empty
          ''',
              '''    self.Page = page
              self.PageContent = singleColumn
              self.ContentRoot = content
              self.SingleColumn = singleColumn
              self.LeftColumn = leftColumn
              self.RightColumn = rightColumn
              self.PageList = singleList
              self.LeftList = leftList
              self.RightList = rightList
              self.EmptyState = empty
              self._updatePageLayout = updatePageLayout
          ''',
              "Tab page fields",
          )

          tab = replace_once(
              tab,
              '''    self.Maid:Give(button.MouseLeave:Connect(function()
                  self._hovered = false
                  self.Window.ThemeManager:Apply(button, true)
              end))

              window:_registerTab(self)
          ''',
              '''    self.Maid:Give(button.MouseLeave:Connect(function()
                  self._hovered = false
                  self.Window.ThemeManager:Apply(button, true)
              end))

              task.defer(updatePageLayout)
              window:_registerTab(self)
          ''',
              "Tab initial layout refresh",
          )

          tab = replace_once(
              tab,
              '''function Tab:_nextLayoutOrder()
              self._layoutOrder += 1
              return self._layoutOrder
          end

          function Tab:_registerSection(section)
              table.insert(self.Sections, section)
          end
          ''',
              '''function Tab:_nextLayoutOrder()
              self._layoutOrder += 1
              return self._layoutOrder
          end

          function Tab:_normalizeSide(side)
              return normalizeSide(side)
          end

          function Tab:_getSectionParent(side)
              if self.Layout == "Split" then
                  return normalizeSide(side) == "Right" and self.RightColumn or self.LeftColumn
              end
              return self.SingleColumn
          end

          function Tab:_refreshLayout()
              if self._updatePageLayout then
                  task.defer(self._updatePageLayout)
              end
          end

          function Tab:_reparentSections()
              for _, section in ipairs(self.Sections) do
                  if section.Frame and section.Frame.Parent then
                      section.Frame.Parent = self:_getSectionParent(section.Side)
                  end
              end
              self:_refreshLayout()
          end

          function Tab:_registerSection(section)
              table.insert(self.Sections, section)
              self:_refreshLayout()
          end
          ''',
              "Tab layout methods",
          )

          tab = replace_once(
              tab,
              '''function Tab:_unregisterSection(section)
              local index = table.find(self.Sections, section)
              if index then table.remove(self.Sections, index) end
          end
          ''',
              '''function Tab:_unregisterSection(section)
              local index = table.find(self.Sections, section)
              if index then table.remove(self.Sections, index) end
              self:_refreshLayout()
          end
          ''',
              "Tab unregister refresh",
          )

          tab = replace_once(
              tab,
              '''function Tab:CreateSection(config)
              return Section.new(self, config)
          end

          function Tab:SetName(name)
          ''',
              '''function Tab:CreateSection(config)
              return Section.new(self, config)
          end

          function Tab:SetLayout(layout)
              layout = normalizeLayout(layout)
              if self.Layout == layout then return self end
              self.Layout = layout
              self:_reparentSections()
              return self
          end

          function Tab:GetLayout()
              return self.Layout
          end

          function Tab:SetSplitEnabled(value)
              return self:SetLayout(value == true and "Split" or "Single")
          end

          function Tab:SetStackBreakpoint(width)
              if width == nil or width == false then
                  self.StackAt = nil
              else
                  width = tonumber(width)
                  if not width or width <= 0 then
                      error("[Note] Tab:SetStackBreakpoint expected a positive number or nil", 2)
                  end
                  self.StackAt = width
              end
              self:_refreshLayout()
              return self
          end

          function Tab:IsStacked()
              return self._stacked == true
          end

          function Tab:SetName(name)
          ''',
              "Tab public layout API",
          )

          tab = replace_once(
              tab,
              '''    self.EmptyState.Visible = query ~= "" and not any
          end
          ''',
              '''    self.EmptyState.Visible = query ~= "" and not any
              self:_refreshLayout()
          end
          ''',
              "Tab search layout refresh",
          )

          tab_path.write_text(tab, encoding="utf-8")

          section_path = Path("src/Components/Section.lua")
          section = section_path.read_text(encoding="utf-8")
          section = replace_once(
              section,
              '''        Description = tostring(config.Description or ""),
                  Collapsible = config.Collapsible == true,
          ''',
              '''        Description = tostring(config.Description or ""),
                  Side = tab:_normalizeSide(config.Side),
                  Collapsible = config.Collapsible == true,
          ''',
              "Section side state",
          )
          section = replace_once(
              section,
              '''        LayoutOrder = tab:_nextLayoutOrder(),
                  Parent = tab.PageContent,
          ''',
              '''        LayoutOrder = tab:_nextLayoutOrder(),
                  Parent = tab:_getSectionParent(self.Side),
          ''',
              "Section side parent",
          )
          section = replace_once(
              section,
              '''function Section:SetVisible(value)
              self.Visible = value == true
              self.Frame.Visible = self.Visible
              return self
          end
          ''',
              '''function Section:SetVisible(value)
              self.Visible = value == true
              self.Frame.Visible = self.Visible
              self.Tab:_refreshLayout()
              return self
          end

          function Section:SetSide(side)
              side = self.Tab:_normalizeSide(side)
              if self.Side == side then return self end
              self.Side = side
              if self.Frame and self.Frame.Parent then
                  self.Frame.Parent = self.Tab:_getSectionParent(side)
              end
              self.Tab:_refreshLayout()
              return self
          end

          function Section:GetSide()
              return self.Side
          end
          ''',
              "Section side API",
          )
          section = replace_once(
              section,
              '''    self.Frame.Visible = self.Visible and (query == "" or sectionMatch or any)
              return self.Frame.Visible
          end
          ''',
              '''    self.Frame.Visible = self.Visible and (query == "" or sectionMatch or any)
              self.Tab:_refreshLayout()
              return self.Frame.Visible
          end
          ''',
              "Section search layout refresh",
          )
          section_path.write_text(section, encoding="utf-8")

          note_path = Path("src/Note.lua")
          note = note_path.read_text(encoding="utf-8")
          note = replace_once(note, 'Version = "0.3.1"', 'Version = "0.4.0"', "Note version")
          note_path.write_text(note, encoding="utf-8")

          showcase_path = Path("examples/showcase.lua")
          showcase = showcase_path.read_text(encoding="utf-8")
          marker = 'local Appearance = Window:CreateTab({\n'
          split_demo = '''local SplitDemo = Window:CreateTab({
              Name = "Split Layout",
              Icon = "panel-left",
              Layout = "Split",
              SplitGap = 10,
              StackAt = nil,
          })

          local LeftPrimary = SplitDemo:CreateSection({
              Name = "Left Column",
              Description = "Split tabs can stay two-column even when the window is narrow.",
              Side = "Left",
              Collapsible = true,
          })

          LeftPrimary:CreateToggle({
              Name = "Enabled",
              Default = true,
          })

          LeftPrimary:CreateInput({
              Name = "Label",
              Placeholder = "Left column value",
          })

          local LeftSecondary = SplitDemo:CreateSection({
              Name = "Left Stack",
              Description = "Each side stacks sections independently.",
              Side = "Left",
          })

          LeftSecondary:CreateButton({
              Name = "Move Right",
              Callback = function()
                  LeftSecondary:SetSide("Right")
              end,
          })

          local RightPrimary = SplitDemo:CreateSection({
              Name = "Right Column",
              Description = "The normal single-column tab layout remains available everywhere else.",
              Side = "Right",
              Collapsible = true,
          })

          RightPrimary:CreateSlider({
              Name = "Amount",
              Minimum = 0,
              Maximum = 100,
              Default = 45,
              Suffix = "%",
          })

          RightPrimary:CreateDropdown({
              Name = "Mode",
              Options = { "Compact", "Balanced", "Detailed" },
              Default = "Balanced",
          })

          '''
          if "local SplitDemo = Window:CreateTab" not in showcase:
              showcase = replace_once(showcase, marker, split_demo + marker, "showcase split tab")
          showcase_path.write_text(showcase, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              "- Tabs, smoothly animated collapsible sections, live search, scrolling, responsive viewport clamping",
              "- Tabs with optional single-column or left/right split layouts, smoothly animated collapsible sections, live search, scrolling, and responsive viewport clamping",
              "README feature list",
          )
          tabs_marker = '''local Tab = Window:CreateTab({
              Name = "Appearance",
              Icon = "palette",
              Disabled = false,
              Visible = true,
          })
          ```
          '''
          tabs_replacement = '''local Tab = Window:CreateTab({
              Name = "Appearance",
              Icon = "palette",
              Disabled = false,
              Visible = true,
          })
          ```

          Split layout is opt-in. It remains two-column at narrow widths unless `StackAt` is set:

          ```lua
          local SplitTab = Window:CreateTab({
              Name = "Split",
              Layout = "Split",
              SplitGap = 12,
              StackAt = nil, -- set a pixel width such as 520 to stack below it
          })

          local Left = SplitTab:CreateSection({
              Name = "Left",
              Side = "Left",
          })

          local Right = SplitTab:CreateSection({
              Name = "Right",
              Side = "Right",
          })
          ```
          '''
          readme = replace_once(readme, tabs_marker, tabs_replacement, "README split example")
          readme = replace_once(
              readme,
              '''Tab:CreateSection(config)
          Tab:Select()
          ''',
              '''Tab:CreateSection(config)
          Tab:SetLayout("Single" or "Split")
          Tab:GetLayout()
          Tab:SetSplitEnabled(boolean)
          Tab:SetStackBreakpoint(numberOrNil)
          Tab:IsStacked()
          Tab:Select()
          ''',
              "README tab methods",
          )
          readme = replace_once(
              readme,
              '''    Icon = "settings",
              Collapsible = true,
          ''',
              '''    Icon = "settings",
              Side = "Left", -- used when the tab layout is Split
              Collapsible = true,
          ''',
              "README section side config",
          )
          readme = replace_once(
              readme,
              '''Section:SetVisible(boolean)
          Section:CreateButton(config)
          ''',
              '''Section:SetVisible(boolean)
          Section:SetSide("Left" or "Right")
          Section:GetSide()
          Section:CreateButton(config)
          ''',
              "README section methods",
          )
          readme_path.write_text(readme, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          release = '''## 0.4.0 - 2026-07-26

          ### Added

          - Optional single-column and left/right split tab layouts
          - `Layout = "Split"`, `SplitGap`, and optional `StackAt` tab configuration
          - `Side = "Left"` or `Side = "Right"` section placement
          - Runtime `Tab:SetLayout`, `Tab:SetSplitEnabled`, `Tab:SetStackBreakpoint`, and `Section:SetSide` APIs
          - Split-layout showcase that preserves the existing single-column layout on other tabs

          ### Behavior

          - Split tabs remain two-column at narrow widths by default
          - Responsive one-column stacking is opt-in through `StackAt`
          - Left and right section columns stack independently and continue to support search and collapse animations

          '''
          if "## 0.4.0" not in changelog:
              changelog = replace_once(
                  changelog,
                  "All notable changes to Note are documented here.\n\n",
                  "All notable changes to Note are documented here.\n\n" + release,
                  "CHANGELOG 0.4.0",
              )
          changelog_path.write_text(changelog, encoding="utf-8")

          check_path = Path("tools/check.py")
          check = check_path.read_text(encoding="utf-8")
          guard_marker = '    bundler = load_bundler()\n'
          guards = '''    split_layout_guards = {
              SRC / "Components" / "Tab.lua": (
                  'Layout = normalizeLayout',
                  'LeftColumn',
                  'RightColumn',
                  'Tab:SetLayout',
                  'Tab:SetStackBreakpoint',
              ),
              SRC / "Components" / "Section.lua": (
                  'Side = tab:_normalizeSide',
                  'Section:SetSide',
                  'Section:GetSide',
              ),
          }
          for path, required_tokens in split_layout_guards.items():
              text = path.read_text(encoding="utf-8")
              missing_tokens = [token for token in required_tokens if token not in text]
              if missing_tokens:
                  fail(
                      f"{path.relative_to(ROOT)} lost split-layout support: "
                      + ", ".join(missing_tokens)
                  )

          if 'Version = "0.4.0"' not in note_source:
              fail("Note version was not updated to 0.4.0")
          if 'Layout = "Split"' not in showcase_source or 'Side = "Right"' not in showcase_source:
              fail("showcase is missing the split-layout example")

          '''
          if "split_layout_guards = {" not in check:
              check = replace_once(check, guard_marker, guards + guard_marker, "split layout checks")
          check_path.write_text(check, encoding="utf-8")
          PY

      - name: Generate and verify distribution
        run: |
          python tools/bundle.py
          python tools/check.py

      - name: Restore standard workflow and commit release
        shell: bash
        run: |
          cat > .github/workflows/build.yml <<'YAML'
          name: Build distribution

          on:
            push:
              branches:
                - main
              paths:
                - "src/**"
                - "tools/bundle.py"
                - "tools/check.py"
                - ".github/workflows/build.yml"
            workflow_dispatch:

          permissions:
            contents: write

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"

                - name: Generate and verify distribution
                  run: |
                    python tools/bundle.py
                    python tools/check.py

                - name: Commit generated main.lua
                  run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add main.lua
                    if ! git diff --cached --quiet; then
                      git commit -m "build: regenerate main.lua"
                      git push
                    fi
          YAML

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: add optional split tab layout"
          git push
