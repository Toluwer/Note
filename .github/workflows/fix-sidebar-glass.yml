name: Preserve rounded glass shell

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-sidebar-glass.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep edge-touching sidebar transparent
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/Components/Window.lua")
          text = path.read_text(encoding="utf-8")
          old = 'self.ThemeManager:Bind(sidebar, { BackgroundColor3 = "SecondaryBackground", BackgroundTransparency = "SecondaryTransparency" })'
          new = 'self.ThemeManager:Bind(sidebar, { BackgroundColor3 = "SecondaryBackground" })'
          if old not in text:
              raise SystemExit("sidebar glass patch target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          workflow = Path(".github/workflows/fix-sidebar-glass.yml")
          if workflow.exists():
              workflow.unlink()
          PY
          python tools/bundle.py
          python tools/check.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve single rounded frosted shell"
          git push
