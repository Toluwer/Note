name: Patch command palette to comma key

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-command-palette-comma.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Change command palette shortcut to comma key
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "src/Components/CommandPalette.lua",
              "local key = config.OpenKey or Enum.KeyCode.F12",
              "local key = config.OpenKey or Enum.KeyCode.Comma",
          )
          replace_exact(
              "src/Components/CommandPalette.lua",
              "if modifier == false then return key.Name end",
              "if modifier == false then\n        return key == Enum.KeyCode.Comma and \", / <\" or key.Name\n    end",
          )
          replace_exact(
              "src/Components/CommandPalette.lua",
              "self.OpenKey = config.OpenKey or Enum.KeyCode.F12",
              "self.OpenKey = config.OpenKey or Enum.KeyCode.Comma",
          )

          replace_exact(
              "examples/showcase.lua",
              "Description = \"Search and execute actions with F12.\",\n    OpenKey = Enum.KeyCode.F12,",
              "Description = \"Search and execute actions with the , / < key.\",\n    OpenKey = Enum.KeyCode.Comma,\n    Shortcut = \", / <\",",
          )

          replace_exact(
              "docs/advanced-components.md",
              "OpenKey = Enum.KeyCode.F12,\n    Modifier = false,\n    Shortcut = \"F12\",",
              "OpenKey = Enum.KeyCode.Comma,\n    Modifier = false,\n    Shortcut = \", / <\",",
          )
          replace_exact(
              "docs/advanced-components.md",
              "The default shortcut is `F12`. While open, use Up and Down to move through results, Enter to execute, and Escape to close.",
              "The default shortcut is the comma/less-than key (`Enum.KeyCode.Comma`). While open, use Up and Down to move through results, Enter to execute, and Escape to close.",
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          text = text.replace(
              "- Changed the command palette default shortcut from `Ctrl + P` to `F12`\n",
              "- Changed the command palette default shortcut from `Ctrl + P` to the comma/less-than key (`Enum.KeyCode.Comma`)\n",
          )
          changelog.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Components/CommandPalette.lua examples/showcase.lua docs/advanced-components.md CHANGELOG.md
          git commit -m "fix: use comma key for command palette"
          git push
