name: Harden interrupted section animations

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-section-interruptions.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply interruption-safe animation fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8")

          def replace(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Patch target not found in {path}:\n{old}")
              write(path, text.replace(old, new, count))

          path = "src/Components/Section.lua"

          replace(path,
          '''        _collapseRevision = 0,
                  _expandedHeight = 0,
                  _destroyed = false,
          ''',
          '''        _collapseRevision = 0,
                  _collapseAnimating = false,
                  _expandedHeight = 0,
                  _destroyed = false,
          ''')

          replace(path,
          '''        if not self.Collapsed and bodyClip.AutomaticSize == Enum.AutomaticSize.None then
                      bodyClip.Size = UDim2.new(1, 0, 0, self._expandedHeight)
                  end
          ''',
          '''        if not self.Collapsed
                      and not self._collapseAnimating
                      and bodyClip.AutomaticSize == Enum.AutomaticSize.None then
                      bodyClip.Size = UDim2.new(1, 0, 0, self._expandedHeight)
                  end
          ''')

          replace(path,
          '''    animation:Cancel(clip)
              clip.AutomaticSize = Enum.AutomaticSize.None

              if value then
                  local currentHeight = math.max(clip.AbsoluteSize.Y, clip.Size.Y.Offset, self._expandedHeight)
                  clip.Size = UDim2.new(1, 0, 0, currentHeight)
          ''',
          '''    animation:Cancel(clip)
              self._collapseAnimating = true
              clip.AutomaticSize = Enum.AutomaticSize.None

              if value then
                  local currentHeight = math.max(0, clip.AbsoluteSize.Y)
                  if currentHeight <= 0 and content.Visible then
                      currentHeight = math.max(20, self._expandedHeight)
                  end
                  clip.Size = UDim2.new(1, 0, 0, currentHeight)
          ''')

          replace(path,
          '''                if self._destroyed or revision ~= self._collapseRevision then return end
                          if playbackState == Enum.PlaybackState.Completed and self.Collapsed then
                              content.Visible = false
                              clip.Size = UDim2.new(1, 0, 0, 0)
                          end
          ''',
          '''                if self._destroyed or revision ~= self._collapseRevision then return end
                          self._collapseAnimating = false
                          if playbackState == Enum.PlaybackState.Completed and self.Collapsed then
                              content.Visible = false
                              clip.Size = UDim2.new(1, 0, 0, 0)
                          end
          ''', 1)

          replace(path,
          '''        if tween then
                      local connection
                      connection = tween.Completed:Connect(function(playbackState)
                          if connection then connection:Disconnect() end
                          if self._destroyed or revision ~= self._collapseRevision then return end
                          if playbackState == Enum.PlaybackState.Completed and not self.Collapsed then
                              clip.Size = UDim2.new(1, 0, 0, 0)
                              clip.AutomaticSize = Enum.AutomaticSize.Y
                          end
                      end)
                  end
              end
          ''',
          '''        if tween then
                      local connection
                      connection = tween.Completed:Connect(function(playbackState)
                          if connection then connection:Disconnect() end
                          if self._destroyed or revision ~= self._collapseRevision then return end
                          self._collapseAnimating = false
                          if playbackState == Enum.PlaybackState.Completed and not self.Collapsed then
                              clip.Size = UDim2.new(1, 0, 0, 0)
                              clip.AutomaticSize = Enum.AutomaticSize.Y
                          end
                      end)
                  else
                      self._collapseAnimating = false
                      clip.Size = UDim2.new(1, 0, 0, 0)
                      clip.AutomaticSize = Enum.AutomaticSize.Y
                  end
              end
          ''')

          replace(path,
          '''        if tween then
                      local connection
                      connection = tween.Completed:Connect(function(playbackState)
                          if connection then connection:Disconnect() end
                          if self._destroyed or revision ~= self._collapseRevision then return end
                          self._collapseAnimating = false
                          if playbackState == Enum.PlaybackState.Completed and self.Collapsed then
                              content.Visible = false
                              clip.Size = UDim2.new(1, 0, 0, 0)
                          end
                      end)
                  end
              else
          ''',
          '''        if tween then
                      local connection
                      connection = tween.Completed:Connect(function(playbackState)
                          if connection then connection:Disconnect() end
                          if self._destroyed or revision ~= self._collapseRevision then return end
                          self._collapseAnimating = false
                          if playbackState == Enum.PlaybackState.Completed and self.Collapsed then
                              content.Visible = false
                              clip.Size = UDim2.new(1, 0, 0, 0)
                          end
                      end)
                  else
                      self._collapseAnimating = false
                      content.Visible = false
                      clip.Size = UDim2.new(1, 0, 0, 0)
                  end
              else
          ''')

          replace("src/Note.lua", 'Version = "0.2.2",', 'Version = "0.2.3",')

          changelog = read("CHANGELOG.md")
          marker = "## 0.2.2 - 2026-07-24"
          entry = '''## 0.2.3 - 2026-07-24

          ### Fixed

          - Section collapse now continues from the currently visible height when interrupted
          - Expansion layout updates cannot force an active tween to jump to its final height
          - Rapid alternating clicks remain smooth in both directions

          '''
          if marker not in changelog:
              raise SystemExit("Changelog insertion marker not found")
          write("CHANGELOG.md", changelog.replace(marker, entry + marker, 1))

          workflow = Path(".github/workflows/fix-section-interruptions.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Generate and verify distribution
        run: |
          python tools/bundle.py
          python tools/check.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden section animation interruptions"
          git push
