name: Fix password reveal mask

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-password-reveal.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply password reveal fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8")

          def replace(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Patch target not found in {path}:\n{old}")
              write(path, text.replace(old, new, count))

          replace(
              "src/Components/Input.lua",
              '''        self.Maid:Give(reveal.Activated:Connect(function()
                      self.Revealed = not self.Revealed
                      textBox.TextTransparency = self.Revealed and 0 or 1
                      revealIcon:SetIcon(self.Revealed and "eye" or "eye-off")
                  end))
          ''',
              '''        self.Maid:Give(reveal.Activated:Connect(function()
                      self.Revealed = not self.Revealed
                      textBox.TextTransparency = self.Revealed and 0 or 1
                      if self.PasswordMask then
                          self.PasswordMask.Visible = not self.Revealed
                          self.PasswordMask.TextTransparency = self.Revealed and 1 or 0
                          self.PasswordMask.Text = self.Revealed and "" or string.rep("•", #self.Value)
                      end
                      revealIcon:SetIcon(self.Revealed and "eye" or "eye-off")
                  end))
          ''',
          )

          replace(
              "src/Components/Input.lua",
              '''            TextSize = textBox.TextSize,
                      TextXAlignment = Enum.TextXAlignment.Left,
                      Parent = boxFrame,
          ''',
              '''            TextSize = textBox.TextSize,
                      TextXAlignment = Enum.TextXAlignment.Left,
                      TextYAlignment = Enum.TextYAlignment.Center,
                      Visible = true,
                      TextTransparency = 0,
                      Parent = boxFrame,
          ''',
          )

          replace(
              "src/Components/Input.lua",
              '''        if self.PasswordMask then
                      self.PasswordMask.Text = string.rep("•", #value)
                  end
          ''',
              '''        if self.PasswordMask then
                      self.PasswordMask.Text = self.Revealed and "" or string.rep("•", #value)
                      self.PasswordMask.Visible = not self.Revealed
                      self.PasswordMask.TextTransparency = self.Revealed and 1 or 0
                  end
          ''',
              2,
          )

          replace(
              "README.md",
              '`Callback` runs on submission. `Changed` runs when accepted text changes.\n',
              '`Callback` runs on submission. `Changed` runs when accepted text changes. Password inputs render either the mask or the real text—never both—and keep that state synchronized during typing and `SetValue`.\n',
          )

          replace(
              "examples/showcase.lua",
              'Description = "Password masking with official eye icons.",',
              'Description = "Password masking that fully disappears while the value is revealed.",',
          )

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "## Unreleased\n\n### Fixed\n\n"
          bullet = "- Revealed password inputs now hide and clear the dot mask instead of drawing it beneath the real text\n- Password mask visibility stays synchronized during typing and programmatic value changes\n"
          if marker not in changelog:
              raise SystemExit("Unreleased changelog marker not found")
          changelog_path.write_text(changelog.replace(marker, marker + bullet, 1), encoding="utf-8")

          workflow = Path(".github/workflows/fix-password-reveal.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Generate and verify distribution
        run: |
          python tools/bundle.py
          python tools/check.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: hide password mask while revealed"
          git push
