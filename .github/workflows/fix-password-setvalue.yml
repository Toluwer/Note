name: Synchronize password SetValue mask

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-password-setvalue.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fix SetValue password mask state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/Components/Input.lua")
          text = path.read_text(encoding="utf-8")
          old = '''    if self.PasswordMask then
                  self.PasswordMask.Text = string.rep("•", #value)
              end
          '''
          new = '''    if self.PasswordMask then
                  self.PasswordMask.Text = self.Revealed and "" or string.rep("•", #value)
                  self.PasswordMask.Visible = not self.Revealed
                  self.PasswordMask.TextTransparency = self.Revealed and 1 or 0
              end
          '''
          if old not in text:
              raise SystemExit("SetValue password mask block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/fix-password-setvalue.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Generate and verify distribution
        run: |
          python tools/bundle.py
          python tools/check.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve password reveal state in SetValue"
          git push
